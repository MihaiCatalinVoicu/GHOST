name: dm-emulator

# The emulator substitute of the Phase 9 device gate (design §15.9, G-11, C-21; slice S12): the
# Android-specific parts that fit an emulator, on **API 29 and API 35 x86_64** AOSP images without
# Google services, driven by `reactivecircus/android-emulator-runner`.
#
#   :messaging      `DeviceGateSuite` on the shipped `libghost_client_net.so` (x86_64) and real
#                   SQLCipher: a v3 database migrated to v4 and v5, SCN-A, SCN-B, SCN-F with T25's
#                   WAL at 0 bytes, the one alarm scheduled and cancelled (`dumpsys alarm`), and
#                   SCN-D's key change with the logcat canary scan (§15.9 items 2, 4, 5 and 6);
#   :app            the release smoke test in the **R8-shrunk release APK** (§15.9 item 3):
#                   `-Pghost.smoke.release=true` makes the release the tested build type and signs
#                   it with this machine's throwaway debug key, in this job only;
#   :crypto-bridge  the **host/Android equivalence test** (§15.9 item 7, RG-2, V-16): every case of
#                   `protocol/test-vectors/dm_equivalence.txt` on the host library `ghost-dm-host`,
#                   recorded as a fixture for this commit, then replayed on the emulator's x86_64
#                   test library (`ghost-dm-host` cross-compiled with the `test-vectors` feature,
#                   packaged only in the androidTest APK) and compared byte for byte, with the
#                   control case required to be detected.
#
# **Not run is red** (§15.9 "Status"). A runner without a usable /dev/kvm fails the first step; an
# emulator that does not boot fails the run step; and the check step, which runs whatever happened,
# fails on any API level or suite without output. `scripts/gates/dm-emulator-check.sh` is the judge:
# it requires RESULT_OK, the exact number of device tests this slice runs with 0 failed and
# 0 skipped, and every report line by name, including
# `dm-equivalence: N cases, N identical, control detected` over every case of the file.
#
# Same build inputs for the two halves of the equivalence test (§15.9 item 7): one commit, one
# `Cargo.lock`, Rust 1.98.1, and the portable libcrux cfgs on both builds: every client build here is
# preceded by the `cargo clean -p libcrux-…` of G-R3 (§16.1, V-6) and followed by G-R3's rule on the
# build-script outputs, inline until `libcrux-portable.sh` exists (§22.9 item 15 defers the script).
# The fixture header records the commit and the comparison refuses another; the header does not yet
# record the two cfg lists (§22.17).
#
# Where the fixture is recorded (§22.17): the design has the `android` job of ci.yml record it and
# this workflow replay it. This workflow runs on its own triggers, so it records the fixture itself,
# in the same job, from the same checkout — the property the design asks for (one commit, one lock
# file, one toolchain) holds by construction, and nothing crosses workflows.
#
# Triggers (§15.9, §22.8.9): nightly on main and on dispatch, both API levels; pull requests touching
# the DM modules run API 35 only (the reduced variant: one API level, the same suites, which are
# short). Runners (docs/ci-self-hosted.md): the self-hosted `ghost-runner` machines, which share one
# adb server, so each API level has its own emulator port and serial, and one run per API level at a
# time. Uploads (G-L5): the text outputs only, kept 3 days; no APK or library leaves the runner.
# Supply chain (ci.yml rules): every action pinned by full commit SHA (the comment names the tag).
on:
  pull_request:
    paths:
      # :app carries the release smoke test, proguard-rules.pro and MessagingWiring; client-core/net
      # and build-native.sh build the shipped library the smoke test loads (S12 review: a PR that
      # broke the shrunk-release smoke test ran nothing until the nightly).
      - "ghost/android/app/**"
      - "ghost/android/messaging/**"
      - "ghost/android/crypto-bridge/**"
      - "ghost/android/storage/**"
      - "ghost/android/sync/**"
      - "ghost/android/network/**"
      - "ghost/client-core/dm/**"
      - "ghost/client-core/dm-host/**"
      - "ghost/client-core/net/**"
      - "ghost/scripts/build-native.sh"
      - "ghost/protocol/test-vectors/dm_equivalence.txt"
      - "ghost/scripts/device/dm-emulator-run.sh"
      - "ghost/scripts/gates/dm-emulator-check.sh"
      - ".github/workflows/dm-emulator.yml"
  schedule:
    - cron: "17 2 * * *"
  workflow_dispatch:

permissions:
  contents: read

defaults:
  run:
    shell: bash

env:
  # The same SDK and NDK as ci.yml (§21.13 point 2: `:app` pins `ndkVersion` to NDK_PACKAGE, and the
  # `android`, `reproducible` and `dm-emulator` jobs install it).
  ANDROID_PACKAGES: "platform-tools platforms;android-37.0 platforms;android-37.2 build-tools;37.0.0 build-tools;36.0.0"
  NDK_PACKAGE: "ndk;30.0.16248370"
  CARGO_NDK_VERSION: "4.1.2"

jobs:
  emulator:
    name: emulator (API ${{ matrix.api }}, x86_64)
    runs-on: [self-hosted, linux, x64, ghost]
    timeout-minutes: 150
    strategy:
      fail-fast: false
      matrix:
        api: ${{ fromJSON(github.event_name == 'pull_request' && '[35]' || '[29, 35]') }}
    concurrency:
      group: dm-emulator-api${{ matrix.api }}
      cancel-in-progress: false
    env:
      # One emulator per API level on the shared adb server; adb reads ANDROID_SERIAL.
      EMULATOR_PORT: ${{ matrix.api == 29 && '5570' || '5572' }}
      ANDROID_SERIAL: emulator-${{ matrix.api == 29 && '5570' || '5572' }}
    defaults:
      run:
        shell: bash
        working-directory: ghost
    steps:
      - name: KVM (a runner without it reports not run, which is red)
        working-directory: .
        run: |
          if [ -r /dev/kvm ] && [ -w /dev/kvm ]; then
            echo "/dev/kvm is usable"
          else
            echo "dm-emulator: API ${{ matrix.api }} not run: /dev/kvm is missing or not writable by $(id -un) on this runner" | tee -a "$GITHUB_STEP_SUMMARY"
            exit 1
          fi
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: android-actions/setup-android@9fc6c4e9069bf8d3d10b2204b1fb8f6ef7065407 # v3
        with:
          packages: ${{ env.ANDROID_PACKAGES }} ${{ env.NDK_PACKAGE }}
      - name: validate gradle wrapper checksum
        uses: gradle/actions/wrapper-validation@ed408507eac070d1f99cc633dbcf757c94c7933a # v4
      - uses: gradle/actions/setup-gradle@ed408507eac070d1f99cc633dbcf757c94c7933a # v4
        with:
          cache-read-only: ${{ github.ref != 'refs/heads/main' }}
      - uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87 # stable branch
        with:
          toolchain: 1.98.1
          targets: aarch64-linux-android, x86_64-linux-android
      - name: install pinned protoc and cargo-ndk
        run: |
          bash scripts/install-protoc.sh "$RUNNER_TEMP/protoc"
          echo "$RUNNER_TEMP/protoc/bin" >> "$GITHUB_PATH"
          # The check build-native.sh runs (see ci.yml android-native for why it is this one).
          have="$(cargo ndk --version 2>/dev/null | awk '{print $2}' || true)"
          if [ "$have" = "$CARGO_NDK_VERSION" ]; then
            echo "cargo-ndk $CARGO_NDK_VERSION already installed"
          else
            cargo install cargo-ndk --version "$CARGO_NDK_VERSION" --locked --force
          fi
      # The shipped library, built here (§22.8.9 point 3: this workflow builds its own native
      # libraries; nothing is handed over between workflows). `:network` packages it into the app,
      # and `:messaging`'s androidTest APK packages the same directory (§15.9 item 3).
      - name: build libghost_client_net.so (the shipped library) and G-R6 on it
        run: |
          export ANDROID_NDK_HOME="$ANDROID_SDK_ROOT/ndk/${NDK_PACKAGE#ndk;}"
          for triple in aarch64-linux-android x86_64-linux-android; do
            CARGO_TARGET_DIR=target/android-native cargo clean -p libcrux-ml-kem -p libcrux-sha3 -p libcrux-intrinsics -p libcrux-aes --target "$triple" --release || true
          done
          bash scripts/build-native.sh "$RUNNER_TEMP/native" "$RUNNER_TEMP/native.sha256"
          cat "$RUNNER_TEMP/native.sha256"
          mkdir -p android/network/src/main/jniLibs
          cp -r "$RUNNER_TEMP/native/." android/network/src/main/jniLibs/
          bash scripts/gates/dm-jni-surface.sh \
            "$RUNNER_TEMP/native/arm64-v8a/libghost_client_net.so" \
            "$RUNNER_TEMP/native/x86_64/libghost_client_net.so"
      # The emulator's test library (§22.8.10 point 6): the same source, pins and toolchain plus the
      # `test-vectors` and `pq-spy` features, which only `ghost-dm-host` enables (`pq-spy` runs PQ1's
      # assertion around every openIntro, §22.20, and adds no symbol); `--test` lets it, and only it,
      # export the equivalence entry point.
      - name: build the x86_64 test library (ghost-dm-host with test-vectors) and G-R6 --test on it
        run: |
          export ANDROID_NDK_HOME="$ANDROID_SDK_ROOT/ndk/${NDK_PACKAGE#ndk;}"
          CARGO_TARGET_DIR=target/dm-test-jni cargo clean -p libcrux-ml-kem -p libcrux-sha3 -p libcrux-intrinsics -p libcrux-aes --target x86_64-linux-android --release || true
          rm -rf android/crypto-bridge/build/dm-test-jni
          CARGO_TARGET_DIR=target/dm-test-jni cargo ndk -t x86_64 -o android/crypto-bridge/build/dm-test-jni \
            build --release --locked -p ghost-dm-host
          bash scripts/gates/dm-jni-surface.sh --test android/crypto-bridge/build/dm-test-jni/x86_64/libghost_dm_host.so
      - name: build ghost-dm-host (the host library) and G-R6 --test on it
        run: |
          cargo clean -p libcrux-ml-kem -p libcrux-sha3 -p libcrux-intrinsics -p libcrux-aes --release || true
          cargo build -p ghost-dm-host --release --locked
          echo "GHOST_DM_NATIVE=$PWD/target/release/libghost_dm_host.so" >> "$GITHUB_ENV"
          bash scripts/gates/dm-jni-surface.sh --test "$PWD/target/release/libghost_dm_host.so"
      # G-R3 (§16.1, V-6; `libcrux-portable.sh` since the S0′ gate slice, §22.33, which replaced the
      # inline loop this step held) on the four builds above: exactly one build-script output of each
      # of the three libcrux packages per build (each build was preceded by the libcrux clean), and
      # none of them turns on a SIMD backend.
      - name: portable libcrux on every build (G-R3)
        run: |
          bash scripts/gates/libcrux-portable.sh \
            --target-dir target/android-native/aarch64-linux-android/release \
            --target-dir target/android-native/x86_64-linux-android/release \
            --target-dir target/dm-test-jni/x86_64-linux-android/release \
            --target-dir target/release
      # The host half of the equivalence test: every case through JNI on ghost-dm-host, recorded
      # as build/dm-equivalence/dm_equivalence_host.txt with this commit in its header. `--rerun`:
      # build caching is on, and a restored result would record nothing.
      - name: record the host equivalence fixture (this commit)
        working-directory: ghost/android
        run: |
          ./gradlew --no-daemon :crypto-bridge:testDebugUnitTest --rerun \
            --tests 'org.ghost.crypto.bridge.DmEquivalenceHostTest' \
            -Dghost.dm.native="$GHOST_DM_NATIVE" -Dghost.dm.commit="$GITHUB_SHA"
          fixture=crypto-bridge/build/dm-equivalence/dm_equivalence_host.txt
          grep -qx "# commit $GITHUB_SHA" "$fixture"
          grep -q 'skipped="0"' crypto-bridge/build/test-results/testDebugUnitTest/TEST-org.ghost.crypto.bridge.DmEquivalenceHostTest.xml
          head -n 3 "$fixture"
      - name: assemble the device suites and the R8-shrunk release, and G-DM5 on its mapping
        working-directory: ghost/android
        run: |
          ./gradlew --no-daemon -Pghost.smoke.release=true \
            :crypto-bridge:assembleDebugAndroidTest :messaging:assembleDebugAndroidTest \
            :app:assembleRelease :app:assembleReleaseAndroidTest
          bash ../scripts/gates/apk-no-debug-hooks.sh app/build/outputs/mapping/release/mapping.txt
      - name: boot the emulator and run the suites
        uses: reactivecircus/android-emulator-runner@a421e43855164a8197daf9d8d40fe71c6996bb0d # v2.38.0
        env:
          GHOST_DM_COMMIT: ${{ github.sha }}
        with:
          api-level: ${{ matrix.api }}
          target: default
          arch: x86_64
          emulator-port: ${{ env.EMULATOR_PORT }}
          avd-name: ghost-dm-api${{ matrix.api }}
          force-avd-creation: true
          emulator-options: -no-window -gpu swiftshader_indirect -no-snapshot -noaudio -no-boot-anim
          disable-animations: true
          working-directory: ghost
          script: bash scripts/device/dm-emulator-run.sh ${{ matrix.api }} "$RUNNER_TEMP/dm-emulator"
      - name: check the emulator report (not run is red)
        if: always()
        run: |
          {
            echo "## DM emulator, API ${{ matrix.api }}"
            echo
            echo '```'
            if [ -d "$RUNNER_TEMP/dm-emulator/api${{ matrix.api }}" ]; then
              cat "$RUNNER_TEMP/dm-emulator/api${{ matrix.api }}/device.txt" 2>/dev/null || true
              for f in "$RUNNER_TEMP/dm-emulator/api${{ matrix.api }}"/*.txt; do
                tr -d '\r' < "$f" | sed -e 's/^INSTRUMENTATION_RESULT: stream=//' | grep -E '^(dm-|device tests:|INSTRUMENTATION_CODE:)' || true
              done
            else
              echo "not run"
            fi
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
          bash scripts/gates/dm-emulator-check.sh "$RUNNER_TEMP/dm-emulator" ${{ matrix.api }}
      # Evidence, not a gate: an upload the artifact quota refuses must not turn the job red (§22.33).
      - name: upload the text outputs
        if: always()
        continue-on-error: true
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: dm-emulator-api${{ matrix.api }}
          path: ${{ runner.temp }}/dm-emulator
          if-no-files-found: warn
          retention-days: 3
