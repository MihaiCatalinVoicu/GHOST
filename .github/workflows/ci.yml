name: ci

# GHOST CI (ADR-10). Every job is a gate — but nothing on GitHub enforces it (Phase 9 review
# GATES-4): GitHub Free offers no branch protection or rulesets for this private repository, no
# pull request is opened and pushes go straight to main, so a red job blocks nothing by itself. A
# merge is judged by the runs of the pushed commit (`gh run list`, read after the push) and by the
# local verification docs/ci-self-hosted.md describes. Jobs never receive signing material (TB-6);
# release signing is offline (FR-8.2).
# Supply chain (FR-8.1): every action is pinned by full commit SHA (the comment names the tag it
# was resolved from); Rust builds use --locked; cargo-ndk is pinned in scripts/build-native.sh and
# protoc (a build tool of the relay and of the native library) in scripts/install-protoc.sh.
# Every run step uses bash with -eo pipefail, so a failure inside a pipeline fails the step.
# Runners (docs/ci-self-hosted.md): every job runs on the owner's self-hosted runners (labels
# self-hosted, linux, x64, ghost; four at a time, jobs beyond that queue), a persistent machine: each
# job starts from actions/checkout's cleaned workspace and a runner temp directory the runner empties,
# and keeps nothing it needs elsewhere. Self-hosted runners are allowed only while the repository is
# private. Uploads (gate G-L5, scripts/gates/no-public-binaries.sh; ADR-39): no binary is ever published;
# the internal native hand-off below goes through the Actions cache of the run (Phase 9 design §22.33:
# from 2026-09-20 the artifact storage quota failed every upload, so the job that uploaded the hand-off
# went red and the android and reproducible jobs were skipped on every run); a gate's evidence (text
# reports) is kept 3 days when an upload succeeds, and an upload that fails never decides a job.
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
    inputs:
      live_tor:
        description: "Run the live Tor bootstrap test (network)"
        type: boolean
        default: false

permissions:
  contents: read

defaults:
  run:
    shell: bash

env:
  GHOST_ROOT: ${{ github.workspace }}/ghost
  CARGO_NDK_VERSION: "4.1.2"
  ANDROID_PACKAGES: "platform-tools platforms;android-37.0 platforms;android-37.2 build-tools;37.0.0 build-tools;36.0.0"
  NDK_PACKAGE: "ndk;30.0.16248370"

jobs:
  static-gates:
    name: static gates (placeholder, logging, manifest, dependency allowlist, proto)
    runs-on: [self-hosted, linux, x64, ghost]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: install pinned protoc
        run: |
          bash ghost/scripts/install-protoc.sh "$RUNNER_TEMP/protoc"
          echo "$RUNNER_TEMP/protoc/bin" >> "$GITHUB_PATH"
      - name: run gates
        run: bash ghost/scripts/gates/run-all.sh
      - name: gates must reject the negative fixtures
        run: bash ghost/scripts/gates/self-test.sh

  rust:
    name: rust (fmt, clippy -D warnings, test, cargo-deny, cargo-audit, client allowlist)
    runs-on: [self-hosted, linux, x64, ghost]
    # The workspace build and tests, the release crash suite and the T2 PR variant (about 20 min
    # on a 4-vCPU runner, from a local measurement; see the step): twice the expected total.
    timeout-minutes: 150
    defaults:
      run:
        shell: bash
        working-directory: ghost
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          # entitlement-schedule.sh compares the schedule with its predecessor in git (rule 5).
          fetch-depth: 0
      - uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87 # stable branch
        with:
          toolchain: 1.98.1
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
        with:
          workspaces: ghost
      - name: install pinned protoc (tonic-prost-build compiles protocol/relay/v1)
        run: |
          bash scripts/install-protoc.sh "$RUNNER_TEMP/protoc"
          echo "$RUNNER_TEMP/protoc/bin" >> "$GITHUB_PATH"
      - run: cargo fmt --all -- --check
      # G-R3 (Phase 9 design §16.1, §22.33): every client build is preceded by the libcrux clean — the
      # three build scripts do not re-run when LIBCRUX_DISABLE_SIMD* change, and rust-cache restores
      # target/ — and the host test build's cargo messages are read before any test runs.
      - name: libcrux clean (G-R3)
        run: cargo clean -p libcrux-ml-kem -p libcrux-sha3 -p libcrux-intrinsics
      - run: cargo clippy --workspace --all-targets --locked -- -D warnings
      - name: workspace test build, portable libcrux only (G-R3)
        run: |
          cargo test --workspace --locked --no-run --message-format=json-render-diagnostics > "$RUNNER_TEMP/test-build.json"
          bash scripts/gates/libcrux-portable.sh --json "$RUNNER_TEMP/test-build.json"
      - run: cargo test --workspace --locked
      # Design §19.17 point 2: the issuer crash suite (I-A … I-H, double crashes) runs in the
      # release profile; a debug build lists its tests as ignored.
      - name: issuer crash suite (release profile)
        run: cargo test -p ghost-issuer --release --locked --test crash
      # Design §13.4, §13.6: the T2 PR variant (N = 300 packs, 21 days, release profile): the join
      # search, the amount uniformity A1 (§19.31), the twin worlds, S1–S4; its report must be
      # complete, A1 included (t2-exit-gate.yml runs the
      # gate scale, the nightly seed sweep and the mutants). World databases go to /dev/shm.
      # Budget: measured locally at 506–590 s on 24 cores (ten worlds in two parallel phases, the
      # longest about 290 s); on a 4-vCPU runner about 20 minutes after the build.
      - name: T2 PR variant (release profile)
        env:
          GHOST_T2_TMP: /dev/shm
        run: |
          mkdir -p "$RUNNER_TEMP/t2"
          export GHOST_T2_REPORT="$RUNNER_TEMP/t2/t2-pr.txt"
          cargo test -p ghost-issuer --release --locked --test t2_unlinkability t2_pr_variant -- --exact --nocapture
      - name: T2 PR variant report check
        if: always()
        run: |
          cat "$RUNNER_TEMP/t2/t2-pr.txt" >> "$GITHUB_STEP_SUMMARY" 2>/dev/null || true
          bash scripts/gates/t2-report-check.sh "$RUNNER_TEMP/t2/t2-pr.txt" pr
      - uses: EmbarkStudios/cargo-deny-action@3c6349835b2b7b196a839186cb8b78e02f7b5f25 # v2
        with:
          manifest-path: ghost/Cargo.toml
          command: check
      - uses: taiki-e/install-action@fa23953489c080190314742a9b907f8e97c6767c # v2
        with:
          tool: cargo-audit@0.22.2,cargo-deny@0.20.2
      # Same accepted advisory and scopes as deny.toml (ADR-22): rsa 0.9.10 is verification-only
      # inside Arti (client); rsa 0.10.0-rc.18 is reached only through blind-rsa-signatures in the
      # issuer (payment-gated, fault-checked, 2 s reply quantum). The feature policy and the crypto
      # pins below enforce both scopes.
      - run: cargo audit --ignore RUSTSEC-2023-0071
      - name: Rust client package allowlist (T7 for the native library)
        run: bash scripts/gates/rust-client-allowlist.sh
      - name: Arti/tonic feature policy (vanguards on; relay/onion-service-service/keymgr/pt-client off; tonic codegen only; rsa per version; issuer crates out of client and relay)
        run: bash scripts/gates/rust-feature-policy.sh
      - name: Rust crypto version pins per graph (rsa, crypto-bigint, blind-rsa-signatures, num-bigint-dig, ring)
        run: bash scripts/gates/rust-crypto-pins.sh
      # The S0′ gate slice (Phase 9 design §16.1, §22.33): G-R4's graph half (no logging crate in the DM
      # graph; log only through jni; nothing installs a logger), G-R7 (a vodozemac or libcrux change
      # keeps the previous goldens and runs UpgradeTest, the encoder check and PQ5; the base is the pull
      # request's base or the push's previous head, a new branch's all-zero `before` falling back to
      # HEAD~1) and G-R8 (the clock, logging and network sites of the shipped DM graph equal their
      # justified baseline).
      - name: DM graph gates (G-R4 no logging crate, G-R7 golden lock, G-R8 vendored clock and logging sites)
        env:
          GOLDEN_BASE: ${{ github.event.pull_request.base.sha || github.event.before }}
        run: |
          bash scripts/gates/dm-rust-no-logging.sh
          if [ -n "$GOLDEN_BASE" ] && [ "$GOLDEN_BASE" != 0000000000000000000000000000000000000000 ]; then
            bash scripts/gates/dm-golden-lock.sh --base "$GOLDEN_BASE"
          else
            bash scripts/gates/dm-golden-lock.sh
          fi
          bash scripts/gates/dm-vendored-clock-log.sh
      # ADR-37 (Phase 9 design §2.10.2, §22.8.10 points 2, 3, 10): the licence gates that need the Rust
      # toolchain and the published sources: the notices of every shipped Rust graph, compared with the
      # committed ghost/licenses/THIRD_PARTY_NOTICES-*.txt (G-L1), the licence declarations of the shipped
      # packages' sources (G-R5), the MPL-2.0 packages and the source bundle built from their .crate
      # archives (G-L4).
      - name: licence gates (G-L1 Rust notices, G-R5 source headers, G-L4 MPL-2.0 sources and bundle)
        run: |
          bash scripts/gates/license-notices.sh rust
          bash scripts/gates/rust-license-headers.sh
          bash scripts/gates/mpl-sources.sh --bundle "$RUNNER_TEMP/mpl-sources"
      - name: Entitlement Schedule (pinned key, rule 5 against its git predecessor, relay directory, one path, no test material in production)
        run: bash scripts/gates/entitlement-schedule.sh
      - name: clippy clearnet bans fire on the negative fixture (T6)
        run: bash scripts/gates/clippy-clearnet-fixture.sh
      - name: Rust gate self-tests (feature policy, clippy fixture, Entitlement Schedule and the cargo-deny bans reject counter-examples)
        env:
          GHOST_SELFTEST_CLIPPY: "1"
          GHOST_SELFTEST_OPS: "1"
          GHOST_SELFTEST_DENY: "1"
        run: bash scripts/gates/self-test.sh
      - name: privacy invariant T1 (relay capture validator)
        run: bash scripts/gates/privacy-capture.sh

  android-native:
    name: android native libs (two same-path builds, identical hashes, no build paths)
    runs-on: [self-hosted, linux, x64, ghost]
    # The sums of the checked libraries: the android and reproducible jobs verify the hand-off they
    # restore against them, so a cache entry of another attempt or a damaged one cannot stand in.
    outputs:
      sums: ${{ steps.sums.outputs.sums }}
    defaults:
      run:
        shell: bash
        working-directory: ghost
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87 # stable branch
        with:
          toolchain: 1.98.1
          targets: aarch64-linux-android, x86_64-linux-android
      - uses: android-actions/setup-android@9fc6c4e9069bf8d3d10b2204b1fb8f6ef7065407 # v3
        with:
          packages: ${{ env.NDK_PACKAGE }}
      - name: install pinned protoc and cargo-ndk
        run: |
          bash scripts/install-protoc.sh "$RUNNER_TEMP/protoc"
          echo "$RUNNER_TEMP/protoc/bin" >> "$GITHUB_PATH"
          # CARGO_HOME is persistent on the self-hosted runners (docs/ci-self-hosted.md): a run
          # cancelled mid-install can leave cargo-ndk's binaries in CARGO_HOME/bin without cargo's
          # own install record, so a later plain `cargo install` refuses them ("already exists in
          # destination"). `cargo install --list` only proves cargo's own ledger has an entry, not
          # that the binary it names still runs -- a wedged ledger entry with a missing or broken
          # binary (observed on ghost-runner-2, 2026-09-21: `cargo install --list` said installed,
          # `cargo ndk --version` found nothing) made this step skip forever while
          # build-native.sh's own check kept failing. Run the exact check build-native.sh runs, so
          # the two can never disagree: skip only when the binary itself answers with the pinned
          # version, and --force clears a stray, wedged or half-installed one either way.
          have="$(cargo ndk --version 2>/dev/null | awk '{print $2}' || true)"
          if [ "$have" = "$CARGO_NDK_VERSION" ]; then
            echo "cargo-ndk $CARGO_NDK_VERSION already installed"
          else
            cargo install cargo-ndk --version "$CARGO_NDK_VERSION" --locked --force
          fi
      - name: build twice at the same path from a clean target dir (remapped paths, leak check)
        run: |
          export ANDROID_NDK_HOME="$ANDROID_SDK_ROOT/ndk/${NDK_PACKAGE#ndk;}"
          bash scripts/build-native.sh "$RUNNER_TEMP/native-a" "$RUNNER_TEMP/a.sha256"
          rm -rf target/android-native
          bash scripts/build-native.sh "$RUNNER_TEMP/native-b" "$RUNNER_TEMP/b.sha256"
          cat "$RUNNER_TEMP/a.sha256"
          diff "$RUNNER_TEMP/a.sha256" "$RUNNER_TEMP/b.sha256"
          mkdir -p android/network/src/main/jniLibs
          cp -r "$RUNNER_TEMP/native-a/." android/network/src/main/jniLibs/
          cp "$RUNNER_TEMP/a.sha256" native-libs.sha256
      # G-R6 (Phase 9 design §2.6, §22.8.10 points 6 and 10): the **shipped** libraries export
      # exactly the closed DM surface. This is the artifact that reaches a device; the `android`
      # job checks the same list against the `ghost-dm-host` build the JVM tests load. Release
      # builds strip `.symtab` (ghost/Cargo.toml) and keep `.dynsym`, which is what `nm -D` reads.
      - name: G-R6 closed JNI surface (the shipped libraries)
        run: |
          bash scripts/gates/dm-jni-surface.sh \
            "$RUNNER_TEMP/native-a/arm64-v8a/libghost_client_net.so" \
            "$RUNNER_TEMP/native-a/x86_64/libghost_client_net.so"
      # G-R3 (Phase 9 design §16.1, §22.33): cargo-ndk prints no cargo messages, so the detector reads
      # the build-script outputs of the second build, which ran in a removed-then-recreated target
      # directory after build-native.sh's libcrux clean: exactly one output per package and triple.
      - name: G-R3 portable libcrux in both shipped triples
        run: |
          bash scripts/gates/libcrux-portable.sh \
            --target-dir target/android-native/aarch64-linux-android/release \
            --target-dir target/android-native/x86_64-linux-android/release
      # G-R7 (c) (§2.9, V-9): the shipped libraries hold Olm's KDF labels and none of the strings of the
      # HPKE code the linker drops; if a bump makes it keep them, the audit scope must be re-decided.
      - name: G-R7 (c) the linker still drops hpke
        run: |
          bash scripts/gates/dm-golden-lock.sh --library \
            "$RUNNER_TEMP/native-a/arm64-v8a/libghost_client_net.so" \
            "$RUNNER_TEMP/native-a/x86_64/libghost_client_net.so"
      - name: record the checked sums
        id: sums
        run: |
          {
            echo 'sums<<GHOST_SUMS_EOF'
            cat native-libs.sha256
            echo 'GHOST_SUMS_EOF'
          } >> "$GITHUB_OUTPUT"
      # Internal hand-off (Phase 9 design §22.8.9 point 3 and §22.33, private repository only): the
      # android and reproducible jobs of this run restore it from the Actions cache, whose storage is
      # not the artifact quota that stopped every upload from 2026-09-20. The key carries the run, so no
      # other run can restore it (G-L5 requires that), and the consumers check it against `sums`.
      - name: hand the checked libraries to the android and reproducible jobs (Actions cache of this run)
        uses: actions/cache/save@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: |
            ghost/android/network/src/main/jniLibs
            ghost/native-libs.sha256
          key: ghost-client-net-jniLibs-${{ github.run_id }}-${{ github.run_attempt }}

  android:
    name: android (build with the native Tor core, unit tests, lint, dependency verification)
    runs-on: [self-hosted, linux, x64, ghost]
    needs: android-native
    defaults:
      run:
        shell: bash
        working-directory: ghost/android
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      # The libraries android-native built twice and checked. `restore-keys` lets a re-run of this job
      # alone take the entry of the attempt that built them; the next step checks it is that one.
      - name: the libraries android-native checked (Actions cache of this run)
        uses: actions/cache/restore@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: |
            ghost/android/network/src/main/jniLibs
            ghost/native-libs.sha256
          key: ghost-client-net-jniLibs-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: ghost-client-net-jniLibs-${{ github.run_id }}-
          fail-on-cache-miss: true
      - name: the restored libraries are the ones android-native checked
        working-directory: ghost
        env:
          SUMS: ${{ needs.android-native.outputs.sums }}
        run: |
          printf '%s\n' "$SUMS" > "$RUNNER_TEMP/expected.sha256"
          diff "$RUNNER_TEMP/expected.sha256" native-libs.sha256
          (cd android/network/src/main/jniLibs && sha256sum -c "$RUNNER_TEMP/expected.sha256")
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: android-actions/setup-android@9fc6c4e9069bf8d3d10b2204b1fb8f6ef7065407 # v3
        with:
          packages: ${{ env.ANDROID_PACKAGES }} ${{ env.NDK_PACKAGE }}
      - name: validate gradle wrapper checksum
        uses: gradle/actions/wrapper-validation@ed408507eac070d1f99cc633dbcf757c94c7933a # v4
      - uses: gradle/actions/setup-gradle@ed408507eac070d1f99cc633dbcf757c94c7933a # v4
        with:
          cache-read-only: ${{ github.ref != 'refs/heads/main' }}
      # The DM JVM tests run the real ratchet (Phase 9 design §2.7, §15.1; evidence V-5): the host
      # build of `ghost-client-dm` is a minute-scale build (no Arti), and `-Dghost.dm.native` points
      # `DmNative` at it. S0' verified the MSVC variant on the owner's machine and left the Linux
      # load to this job; if `System.load` fails here, the §17.1 re-plan applies.
      - uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87 # stable branch
        with:
          toolchain: 1.98.1
      # With the `provenance` feature (slice S11, T35): every seal of every DM world asserts the
      # key kinds §9.3 allows, and the privacy report's T35 line is written only for such a build.
      # G-R3 (§22.33): the host library the JVM tests load is a client build too; its cargo messages
      # are read like the rust job's.
      - name: build ghost-dm-host (the DM host library the JVM tests load)
        working-directory: ghost
        run: |
          cargo clean -p libcrux-ml-kem -p libcrux-sha3 -p libcrux-intrinsics --release || true
          cargo build -p ghost-dm-host --release --locked --features provenance --message-format=json-render-diagnostics > "$RUNNER_TEMP/dm-host-build.json"
          bash scripts/gates/libcrux-portable.sh --json "$RUNNER_TEMP/dm-host-build.json"
          echo "GHOST_DM_NATIVE=$PWD/target/release/libghost_dm_host.so" >> "$GITHUB_ENV"
      - run: ./gradlew build --no-daemon -Dghost.dm.native="$GHOST_DM_NATIVE"
      # A failed test's message and stack trace in the job summary: the test reports are not uploaded.
      - name: failed tests (job summary)
        if: failure()
        run: bash ../scripts/ci/junit-failures.sh */build/test-results/testDebugUnitTest >> "$GITHUB_STEP_SUMMARY"
      # The PR-scale privacy report (Phase 9 design §15.6, §16.2: "T32 at N = 120 over 14 days" and
      # the privacy mutants on a small world, slice S11): `./gradlew build` ran the privacy worlds of
      # `org.ghost.messaging.dmworld`, and the report is evidence only if something refuses an
      # incomplete one. Since the JD8 slice (§22.26) that includes `DmJd8Test`'s three lines — JD8
      # over the entitlement world's twins, the control the kills are held against, and the two
      # timing leaks its timing clause must catch — and the three mutants it kills, which
      # `privacy-pr` requires.
      - name: DM privacy report check (PR scale)
        run: bash ../scripts/gates/dm-report-check.sh messaging/build/reports/dm/privacy.txt privacy-pr
      # The PR-scale DM report (Phase 9 design §15.4, §16.2; Phase 9 review GATES-1): the same
      # `./gradlew build` writes `report.txt` — the `dm mutants:` line, each mutant's kill, the crash
      # classes, the seeded worlds and the suite cases — and nothing read it: a kill test deleted or
      # @Ignore'd left the JUnit run green and only this file saying so. `pr` is the kind the
      # workflow header of messaging-exit-gate.yml and §15.4 say runs here.
      - name: DM report check (PR scale)
        run: bash ../scripts/gates/dm-report-check.sh messaging/build/reports/dm/report.txt pr
      # G-R6 (host half, §22.8.10 point 10): the exported DM JNI symbols of the `ghost-dm-host`
      # build the JVM tests just loaded are exactly the closed list of §2.6, plus the one
      # equivalence-test entry point a test library adds (`--test`, §15.9 item 7; slice S12). The
      # shipped `libghost_client_net.so` is checked in `android-native`, where it is built, and must
      # not export that entry point.
      - name: G-R6 closed JNI surface (the host build)
        working-directory: ghost
        run: bash scripts/gates/dm-jni-surface.sh --test "$GHOST_DM_NATIVE"
      # ADR-37 (Phase 9 design §2.10.2, §22.8.10 point 10): the Gradle part of the third-party notices and
      # the Gradle licence allowlist (G-L1, G-L2), then the notices asset of the release APK (G-L3).
      - name: licence gates (G-L1 Gradle notices, G-L2 licence allowlist, G-L3 notices in the APK)
        run: |
          ./gradlew --no-daemon :app:releaseRuntimeComponents
          bash ../scripts/gates/license-notices.sh android app/build/licenses/release-runtime-components.txt
          bash ../scripts/gates/apk-notices.sh app/build/outputs/apk/release/app-release-unsigned.apk
      # T15m (Phase 7 design §5.5, ADR-20): what ships is the merged manifest, not the source ones.
      - name: merged release manifest (permissions, exported components, sync job protection, G-DM7 alarm receiver)
        run: bash ../scripts/gates/merged-manifest-lint.sh
      # G-DM5 (Phase 9 design §16.1, §22.8.10 point 11; slice S12): R8's release mapping maps every
      # org.ghost. class to itself (-keepnames) and ships no debug hook, harness, transport seam or
      # equivalence entry point. `./gradlew build` above assembled the release that wrote it.
      - name: G-DM5 release mapping (no debug hook, harness or test entry point; GHOST names kept)
        run: bash ../scripts/gates/apk-no-debug-hooks.sh app/build/outputs/mapping/release/mapping.txt

  sync-exit-gate:
    name: sync exit gate (JVM harness, 20000 seeded worlds, double crashes in both journal modes)
    runs-on: [self-hosted, linux, x64, ghost]
    timeout-minutes: 150
    defaults:
      run:
        shell: bash
        working-directory: ghost/android
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: android-actions/setup-android@9fc6c4e9069bf8d3d10b2204b1fb8f6ef7065407 # v3
        with:
          packages: ${{ env.ANDROID_PACKAGES }}
      - name: validate gradle wrapper checksum
        uses: gradle/actions/wrapper-validation@ed408507eac070d1f99cc633dbcf757c94c7933a # v4
      - uses: gradle/actions/setup-gradle@ed408507eac070d1f99cc633dbcf757c94c7933a # v4
        with:
          cache-read-only: ${{ github.ref != 'refs/heads/main' }}
      # Phase 7 design §8.3–§8.8, §8.10: exhaustive crash enumeration of S-A..S-H (single crashes in
      # DELETE and WAL, double crashes for S-A, S-D, S-F in both), 20 000 seeded worlds, the 13
      # mutants, T19/T3/T20 and the model-relay conformance replay. World databases go to /dev/shm
      # (the crash model is process death, not power loss).
      # --rerun: org.gradle.caching is on and setup-gradle restores the local build cache, so without it
      # an unchanged test task is restored FROM-CACHE and the gate runs nothing; the summary step then
      # fails unless a complete report was written.
      - name: exit-gate harness
        run: ./gradlew --no-daemon :sync:testDebugUnitTest --rerun -Dghost.sync.seeds=20000 -Dghost.sync.exhaustive=full
      - name: job summary (seeds, K/R event counts, mutants, time budget)
        if: always()
        run: |
          report=sync/build/harness/report.txt
          {
            echo "## Sync exit gate"
            echo
            echo '```'
            cat "$report" 2>/dev/null || echo "no harness report was written"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
          fail=0
          for line in '^seeded worlds: 20000 seeds, ' '^mutants: 17 run' '^crashes injected=[0-9]+ caught at the top level=[0-9]+$'; do
            if ! grep -Eq "$line" "$report" 2>/dev/null; then echo "::error::sync harness report: no line matching $line"; fail=1; fi
          done
          exit "$fail"
      - name: failed tests (job summary)
        if: failure()
        run: bash ../scripts/ci/junit-failures.sh sync/build/test-results/testDebugUnitTest >> "$GITHUB_STEP_SUMMARY"
      # Evidence, not a gate: an upload the artifact quota refuses must not turn the job red (§22.33).
      - name: upload the test reports
        if: failure()
        continue-on-error: true
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: sync-exit-gate-reports
          path: ghost/android/sync/build/reports/tests
          if-no-files-found: ignore
          retention-days: 3

  reproducible:
    name: reproducible release build (two builds, identical hash, recorded native libs inside)
    runs-on: [self-hosted, linux, x64, ghost]
    needs: [android-native, android]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: the libraries android-native checked (Actions cache of this run)
        uses: actions/cache/restore@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: |
            ghost/android/network/src/main/jniLibs
            ghost/native-libs.sha256
          key: ghost-client-net-jniLibs-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: ghost-client-net-jniLibs-${{ github.run_id }}-
          fail-on-cache-miss: true
      - name: the restored libraries are the ones android-native checked
        working-directory: ghost
        env:
          SUMS: ${{ needs.android-native.outputs.sums }}
        run: |
          printf '%s\n' "$SUMS" > "$RUNNER_TEMP/expected.sha256"
          diff "$RUNNER_TEMP/expected.sha256" native-libs.sha256
          (cd android/network/src/main/jniLibs && sha256sum -c "$RUNNER_TEMP/expected.sha256")
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: android-actions/setup-android@9fc6c4e9069bf8d3d10b2204b1fb8f6ef7065407 # v3
        with:
          packages: ${{ env.ANDROID_PACKAGES }} ${{ env.NDK_PACKAGE }}
      - run: bash ghost/scripts/gates/reproducible-build.sh "$RUNNER_TEMP/repro" ghost/native-libs.sha256

  live-tor:
    name: live Tor bootstrap, onion stream, circuit isolation (manual)
    if: github.event_name == 'workflow_dispatch' && inputs.live_tor
    runs-on: [self-hosted, linux, x64, ghost]
    timeout-minutes: 20
    defaults:
      run:
        shell: bash
        working-directory: ghost
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87 # stable branch
        with:
          toolchain: 1.98.1
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
        with:
          workspaces: ghost
      - name: install pinned protoc
        run: |
          bash scripts/install-protoc.sh "$RUNNER_TEMP/protoc"
          echo "$RUNNER_TEMP/protoc/bin" >> "$GITHUB_PATH"
      - name: bootstrap Arti, open onion streams, check isolation on real circuits
        env:
          GHOST_LIVE_LOG: info
          # The test keeps Arti's state and cache under the temp directory: the job's own (emptied by
          # the runner), not a /tmp that keeps a previous run's state on a persistent runner.
          TMPDIR: ${{ runner.temp }}
        run: cargo test -p ghost-client-net --locked --test live_tor -- --ignored --nocapture
