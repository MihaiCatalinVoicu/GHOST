name: ci

# GHOST CI (ADR-10). Every job is a gate: a red job blocks merge. Jobs never receive signing
# material (TB-6); release signing is offline (FR-8.2).
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
    inputs:
      live_tor:
        description: "Run the live Tor bootstrap test (network)"
        type: boolean
        default: false

permissions:
  contents: read

env:
  GHOST_ROOT: ${{ github.workspace }}/ghost

jobs:
  static-gates:
    name: static gates (placeholder, logging, manifest, dependency allowlist, proto)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: install protoc
        run: sudo apt-get update -q && sudo apt-get install -y -q protobuf-compiler
      - name: run gates
        run: bash ghost/scripts/gates/run-all.sh
      - name: gates must reject the negative fixtures
        run: bash ghost/scripts/gates/self-test.sh

  rust:
    name: rust (fmt, clippy -D warnings, test, cargo-deny, cargo-audit)
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: ghost
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.98.1
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: ghost
      - name: install protoc (tonic-prost-build compiles protocol/relay/v1)
        run: sudo apt-get update -q && sudo apt-get install -y -q protobuf-compiler
      - run: cargo fmt --all -- --check
      - run: cargo clippy --workspace --all-targets -- -D warnings
      - run: cargo test --workspace
      - uses: EmbarkStudios/cargo-deny-action@v2
        with:
          manifest-path: ghost/Cargo.toml
          command: check
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-audit
      - run: cargo audit
      - name: privacy invariant T1 (relay capture validator)
        run: bash scripts/gates/privacy-capture.sh

  android:
    name: android (build, unit tests, lint, dependency verification)
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: ghost/android
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: android-actions/setup-android@v3
        with:
          packages: "platform-tools platforms;android-37.0 platforms;android-37.2 build-tools;37.0.0 build-tools;36.0.0"
      - name: validate gradle wrapper checksum
        uses: gradle/actions/wrapper-validation@v4
      - uses: gradle/actions/setup-gradle@v4
        with:
          cache-read-only: ${{ github.ref != 'refs/heads/main' }}
      - run: ./gradlew build --no-daemon
      - name: upload unsigned release apk
        uses: actions/upload-artifact@v4
        with:
          name: app-release-unsigned
          path: ghost/android/app/build/outputs/apk/release/app-release-unsigned.apk
          if-no-files-found: error

  reproducible:
    name: reproducible release build (two builds, identical hash)
    runs-on: ubuntu-24.04
    needs: android
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: android-actions/setup-android@v3
        with:
          packages: "platform-tools platforms;android-37.0 platforms;android-37.2 build-tools;37.0.0 build-tools;36.0.0"
      - run: bash ghost/scripts/gates/reproducible-build.sh "$RUNNER_TEMP/repro"

  android-native:
    name: android native libs (cargo-ndk arm64-v8a + x86_64)
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: ghost
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.98.1
          targets: aarch64-linux-android, x86_64-linux-android
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: ghost
          key: android-native
      - uses: android-actions/setup-android@v3
        with:
          packages: "ndk;30.0.16248370"
      - name: install protoc and cargo-ndk
        run: |
          sudo apt-get update -q && sudo apt-get install -y -q protobuf-compiler
          cargo install cargo-ndk --locked
      - name: build libghost_client_net.so
        run: cargo ndk -t arm64-v8a -t x86_64 -o android/network/src/main/jniLibs build --release -p ghost-client-net
      - name: record hashes (feed the signed release manifest)
        run: sha256sum android/network/src/main/jniLibs/*/*.so | tee native-libs.sha256
      - uses: actions/upload-artifact@v4
        with:
          name: ghost-client-net-jniLibs
          path: |
            ghost/android/network/src/main/jniLibs
            ghost/native-libs.sha256
          if-no-files-found: error

  live-tor:
    name: live Tor bootstrap + onion stream (manual)
    if: github.event_name == 'workflow_dispatch' && inputs.live_tor
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    defaults:
      run:
        working-directory: ghost
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.98.1
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: ghost
      - name: install protoc
        run: sudo apt-get update -q && sudo apt-get install -y -q protobuf-compiler
      - name: bootstrap Arti and open an isolated onion stream
        env:
          GHOST_LIVE_LOG: info
        run: cargo test -p ghost-client-net --test live_tor -- --ignored --nocapture
