name: ci

# GHOST CI (ADR-10). Every job is a gate: a red job blocks merge. Jobs never receive signing
# material (TB-6); release signing is offline (FR-8.2).
# Supply chain (FR-8.1): every action is pinned by full commit SHA (the comment names the tag it
# was resolved from); Rust builds use --locked; cargo-ndk is pinned in scripts/build-native.sh and
# protoc (a build tool of the relay and of the native library) in scripts/install-protoc.sh.
# Every run step uses bash with -eo pipefail, so a failure inside a pipeline fails the step.
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
    inputs:
      live_tor:
        description: "Run the live Tor bootstrap test (network)"
        type: boolean
        default: false

permissions:
  contents: read

defaults:
  run:
    shell: bash

env:
  GHOST_ROOT: ${{ github.workspace }}/ghost
  CARGO_NDK_VERSION: "4.1.2"
  ANDROID_PACKAGES: "platform-tools platforms;android-37.0 platforms;android-37.2 build-tools;37.0.0 build-tools;36.0.0"
  NDK_PACKAGE: "ndk;30.0.16248370"

jobs:
  static-gates:
    name: static gates (placeholder, logging, manifest, dependency allowlist, proto)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: install pinned protoc
        run: |
          bash ghost/scripts/install-protoc.sh "$RUNNER_TEMP/protoc"
          echo "$RUNNER_TEMP/protoc/bin" >> "$GITHUB_PATH"
      - name: run gates
        run: bash ghost/scripts/gates/run-all.sh
      - name: gates must reject the negative fixtures
        run: bash ghost/scripts/gates/self-test.sh

  rust:
    name: rust (fmt, clippy -D warnings, test, cargo-deny, cargo-audit, client allowlist)
    runs-on: ubuntu-24.04
    defaults:
      run:
        shell: bash
        working-directory: ghost
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87 # stable branch
        with:
          toolchain: 1.98.1
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
        with:
          workspaces: ghost
      - name: install pinned protoc (tonic-prost-build compiles protocol/relay/v1)
        run: |
          bash scripts/install-protoc.sh "$RUNNER_TEMP/protoc"
          echo "$RUNNER_TEMP/protoc/bin" >> "$GITHUB_PATH"
      - run: cargo fmt --all -- --check
      - run: cargo clippy --workspace --all-targets --locked -- -D warnings
      - run: cargo test --workspace --locked
      - uses: EmbarkStudios/cargo-deny-action@3c6349835b2b7b196a839186cb8b78e02f7b5f25 # v2
        with:
          manifest-path: ghost/Cargo.toml
          command: check
      - uses: taiki-e/install-action@fa23953489c080190314742a9b907f8e97c6767c # v2
        with:
          tool: cargo-audit@0.22.2
      # Same accepted advisory as deny.toml: rsa is verification-only in arti; nothing in the client
      # generates or uses RSA private keys (feature policy below; keystore-empty tests).
      - run: cargo audit --ignore RUSTSEC-2023-0071
      - name: Rust client package allowlist (T7 for the native library)
        run: bash scripts/gates/rust-client-allowlist.sh
      - name: Arti/tonic feature policy (vanguards on; relay/onion-service-service/keymgr/pt-client off; tonic codegen only; rsa only via arti)
        run: bash scripts/gates/rust-feature-policy.sh
      - name: clippy clearnet bans fire on the negative fixture (T6)
        run: bash scripts/gates/clippy-clearnet-fixture.sh
      - name: Rust gate self-tests (feature policy and clippy fixture reject counter-examples)
        env:
          GHOST_SELFTEST_CLIPPY: "1"
        run: bash scripts/gates/self-test.sh
      - name: privacy invariant T1 (relay capture validator)
        run: bash scripts/gates/privacy-capture.sh

  android-native:
    name: android native libs (two same-path builds, identical hashes, no build paths)
    runs-on: ubuntu-24.04
    defaults:
      run:
        shell: bash
        working-directory: ghost
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87 # stable branch
        with:
          toolchain: 1.98.1
          targets: aarch64-linux-android, x86_64-linux-android
      - uses: android-actions/setup-android@9fc6c4e9069bf8d3d10b2204b1fb8f6ef7065407 # v3
        with:
          packages: ${{ env.NDK_PACKAGE }}
      - name: install pinned protoc and cargo-ndk
        run: |
          bash scripts/install-protoc.sh "$RUNNER_TEMP/protoc"
          echo "$RUNNER_TEMP/protoc/bin" >> "$GITHUB_PATH"
          cargo install cargo-ndk --version "$CARGO_NDK_VERSION" --locked
      - name: build twice at the same path from a clean target dir (remapped paths, leak check)
        run: |
          export ANDROID_NDK_HOME="$ANDROID_SDK_ROOT/ndk/${NDK_PACKAGE#ndk;}"
          bash scripts/build-native.sh "$RUNNER_TEMP/native-a" "$RUNNER_TEMP/a.sha256"
          rm -rf target/android-native
          bash scripts/build-native.sh "$RUNNER_TEMP/native-b" "$RUNNER_TEMP/b.sha256"
          cat "$RUNNER_TEMP/a.sha256"
          diff "$RUNNER_TEMP/a.sha256" "$RUNNER_TEMP/b.sha256"
          mkdir -p android/network/src/main/jniLibs
          cp -r "$RUNNER_TEMP/native-a/." android/network/src/main/jniLibs/
          cp "$RUNNER_TEMP/a.sha256" native-libs.sha256
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: ghost-client-net-jniLibs
          path: |
            ghost/android/network/src/main/jniLibs
            ghost/native-libs.sha256
          if-no-files-found: error

  android:
    name: android (build with the native Tor core, unit tests, lint, dependency verification)
    runs-on: ubuntu-24.04
    needs: android-native
    defaults:
      run:
        shell: bash
        working-directory: ghost/android
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: ghost-client-net-jniLibs
          path: ghost
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: android-actions/setup-android@9fc6c4e9069bf8d3d10b2204b1fb8f6ef7065407 # v3
        with:
          packages: ${{ env.ANDROID_PACKAGES }}
      - name: validate gradle wrapper checksum
        uses: gradle/actions/wrapper-validation@ed408507eac070d1f99cc633dbcf757c94c7933a # v4
      - uses: gradle/actions/setup-gradle@ed408507eac070d1f99cc633dbcf757c94c7933a # v4
        with:
          cache-read-only: ${{ github.ref != 'refs/heads/main' }}
      - run: ./gradlew build --no-daemon
      - name: upload unsigned release apk
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: app-release-unsigned
          path: ghost/android/app/build/outputs/apk/release/app-release-unsigned.apk
          if-no-files-found: error

  sync-exit-gate:
    name: sync exit gate (JVM harness, 20000 seeded worlds, double crashes in both journal modes)
    runs-on: ubuntu-24.04
    timeout-minutes: 150
    defaults:
      run:
        shell: bash
        working-directory: ghost/android
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: android-actions/setup-android@9fc6c4e9069bf8d3d10b2204b1fb8f6ef7065407 # v3
        with:
          packages: ${{ env.ANDROID_PACKAGES }}
      - name: validate gradle wrapper checksum
        uses: gradle/actions/wrapper-validation@ed408507eac070d1f99cc633dbcf757c94c7933a # v4
      - uses: gradle/actions/setup-gradle@ed408507eac070d1f99cc633dbcf757c94c7933a # v4
        with:
          cache-read-only: ${{ github.ref != 'refs/heads/main' }}
      # Phase 7 design §8.3–§8.8, §8.10: exhaustive crash enumeration of S-A..S-H (single crashes in
      # DELETE and WAL, double crashes for S-A, S-D, S-F in both), 20 000 seeded worlds, the 13
      # mutants, T19/T3/T20 and the model-relay conformance replay. World databases go to /dev/shm
      # (the crash model is process death, not power loss).
      - name: exit-gate harness
        run: ./gradlew --no-daemon :sync:testDebugUnitTest -Dghost.sync.seeds=20000 -Dghost.sync.exhaustive=full
      - name: job summary (seeds, K/R event counts, mutants, time budget)
        if: always()
        run: |
          {
            echo "## Sync exit gate"
            echo
            echo '```'
            cat sync/build/harness/report.txt 2>/dev/null || echo "no harness report was written"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
      - name: upload the test reports
        if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: sync-exit-gate-reports
          path: ghost/android/sync/build/reports/tests
          if-no-files-found: ignore

  reproducible:
    name: reproducible release build (two builds, identical hash, recorded native libs inside)
    runs-on: ubuntu-24.04
    needs: [android-native, android]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: ghost-client-net-jniLibs
          path: ghost
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: android-actions/setup-android@9fc6c4e9069bf8d3d10b2204b1fb8f6ef7065407 # v3
        with:
          packages: ${{ env.ANDROID_PACKAGES }}
      - run: bash ghost/scripts/gates/reproducible-build.sh "$RUNNER_TEMP/repro" ghost/native-libs.sha256

  live-tor:
    name: live Tor bootstrap, onion stream, circuit isolation (manual)
    if: github.event_name == 'workflow_dispatch' && inputs.live_tor
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    defaults:
      run:
        shell: bash
        working-directory: ghost
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87 # stable branch
        with:
          toolchain: 1.98.1
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
        with:
          workspaces: ghost
      - name: install pinned protoc
        run: |
          bash scripts/install-protoc.sh "$RUNNER_TEMP/protoc"
          echo "$RUNNER_TEMP/protoc/bin" >> "$GITHUB_PATH"
      - name: bootstrap Arti, open onion streams, check isolation on real circuits
        env:
          GHOST_LIVE_LOG: info
        run: cargo test -p ghost-client-net --locked --test live_tor -- --ignored --nocapture
