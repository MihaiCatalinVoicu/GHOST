name: entitlement-exit-gate

# The entitlement exit gate (Phase 8 design §13.2, §13.6, §19.17): the client crash enumeration of
# E-A … E-I with every double crash of E-A, E-D and E-F in both journal modes, and 20 000 seeded
# :entitlement liveness worlds, all with the real entitlement engine and redeem lane over the
# Phase 7 sync harness, the model issuer and the model redeem relays; plus NI-K, the client mutants
# and the conformance replays, which every shard runs. A workflow file of its own, like
# monero-regtest.yml: ci.yml has no schedule.
# Budget (measured in S9 on a 16-thread workstation): the default build's enumeration 524 s and
# 1 000 seeds 62 s; the full gate about 52 min there (835 thread-minutes: single crashes 450 s,
# every double crash 1 400 s, 20 000 seeds 1 240 s). That exceeds the design's 40-minute bound for
# one job, so the gate runs as a matrix of 8 shards (-Dghost.entitlement.shard=i/8): each runs the
# single crashes of every 8th crash class (a class stays whole, so its digests are compared), an
# 8th of the double crashes and of the seeds, about 105 thread-minutes, about 45 minutes on a 4-vCPU
# runner at 1.5 times the per-thread time; the timeout leaves room for a 2-vCPU runner.
# Release-like settings: the full enumeration and seed count a release is gated on; the Android
# plugin builds unit tests for the debug build type only, the one JVM variant there is (as in
# sync-exit-gate). World databases go to /dev/shm (the crash model is process death, not power loss).
# Supply chain (ci.yml rules): every action pinned by full commit SHA (the comment names the tag).
on:
  push:
    branches: [main]
  schedule:
    - cron: "41 3 * * *"
  workflow_dispatch:

permissions:
  contents: read

defaults:
  run:
    shell: bash

env:
  ANDROID_PACKAGES: "platform-tools platforms;android-37.0 platforms;android-37.2 build-tools;37.0.0 build-tools;36.0.0"
  SHARDS: "8"

jobs:
  entitlement-exit-gate:
    name: entitlement exit gate (shard ${{ matrix.shard }}/8, full crash enumeration, 20000 seeded worlds)
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    strategy:
      fail-fast: false
      matrix:
        shard: [0, 1, 2, 3, 4, 5, 6, 7]
    defaults:
      run:
        shell: bash
        working-directory: ghost/android
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: android-actions/setup-android@9fc6c4e9069bf8d3d10b2204b1fb8f6ef7065407 # v3
        with:
          packages: ${{ env.ANDROID_PACKAGES }}
      - name: validate gradle wrapper checksum
        uses: gradle/actions/wrapper-validation@ed408507eac070d1f99cc633dbcf757c94c7933a # v4
      - uses: gradle/actions/setup-gradle@ed408507eac070d1f99cc633dbcf757c94c7933a # v4
        with:
          cache-read-only: ${{ github.ref != 'refs/heads/main' }}
      - name: exit-gate harness (this shard)
        env:
          SHARD: ${{ matrix.shard }}
        run: |
          ./gradlew --no-daemon :entitlement:testDebugUnitTest \
            -Dghost.entitlement.seeds=20000 -Dghost.entitlement.exhaustive=full -Dghost.entitlement.shard="$SHARD/$SHARDS"
      - name: job summary (seeds, K/R event counts, mutants, NI-K, time budget)
        if: always()
        env:
          SHARD: ${{ matrix.shard }}
        run: |
          {
            echo "## Entitlement exit gate, shard $SHARD/$SHARDS"
            echo
            echo '```'
            cat entitlement/build/harness/report.txt 2>/dev/null || echo "no harness report was written"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
      - name: upload the test reports
        if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: entitlement-exit-gate-reports-${{ matrix.shard }}
          path: ghost/android/entitlement/build/reports/tests
          if-no-files-found: ignore
