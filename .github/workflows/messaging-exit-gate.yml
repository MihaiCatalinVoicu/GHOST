name: messaging-exit-gate

# The DM exit gate (Phase 9 design §15.3, §15.4, §15.5, §15.7; slices S10, S10b, S10c and SCN-E): the crash
# enumeration of the implemented SCN-* scenarios and suite cases at **every** event, with the double
# crashes §15.3 names, the "timeout after apply" run at every store (the relay's after-apply event,
# the only one at which the fault exists), SCN-J's `SQLITE_FULL` at
# every write and every commit, the seeded worlds, and every registered mutant killed by its named
# case.
#
# It runs the real DM cryptography: the `ghost-dm-host` build of `ghost-client-dm` is built first
# and passed as `-Dghost.dm.native`, because **without it the DM worlds report themselves skipped
# rather than failing** (`DmWorld.nativeAvailable()`), and a gate whose worlds silently skip is a
# green tick over nothing. The report check below is the other half of that: it fails the job unless
# the report carries a line for every scenario, an enumeration that crashed at **every** event of
# each — singles equal to events, which is what "gate scale" means and what the header alone used
# to assert — a timeout-after-apply run at every store, the double-crash counts, the seeded-world
# lines, the `SQLITE_FULL` line, and one line per mutant naming what killed it and under which rule,
# where "killed" means a run recorded the kill and not that the registry lists the mutant.
#
# SCN-E (§22.25) is the one exception to "every event", and the report says so: it runs on the
# entitlement world (the real redeem and registration lanes, about 1.6 million events of alice over
# 25 days, about a minute a run), and its crash coverage is SAMPLED — eight points per phase of its
# script in this gate, plus a timeout and a crash after apply at up to three of the armed client's
# stores per phase, with each client armed in turn — on `dm crash sample:` lines that
# `dm-report-check.sh` holds to their own rules and never to the every-event one. Measured alone at
# this scale on the workstation below (SCN-E's five tests, `-Dghost.dm.crash=full`): 22 min 50 s
# and 26 min 26 s in two runs of the first version, and 33 min 19 s for the reviewed one (144
# sampled crash runs and 66 store faults, §22.25 item 14(k)); the whole gate with SCN-E in it has
# not been run (§22.25 items 13 and 14(k)), so the figures below are the gate before SCN-E.
#
# The suite cases of §22.27 add three `dm crash classes:` lines, enumerated at every event like the
# others — KC12 4 903 events, RS2 11 053 and RP7 2 193 — and two mutants, MC-21 and MC-24.
# Measured at this scale on the workstation below, `DmSuiteTest` alone (the seven suite cases,
# `-Dghost.dm.crash=full`, beside the PR-scale run of the whole suite), on the code after the
# slice's review: 51 min 13 s, the enumeration test 47 min 35 s of it — 22 750 single-crash runs and
# 22 timeout-after-apply runs, all green (§22.27 item 11(k); the first version, with RS2 at 10 792
# events, took 75 min 16 s under a heavier load). The whole gate with them has not been run either.
#
# Scale. `-Dghost.dm.crash=full` is what makes the enumeration every-event; without it the harness
# samples (the PR scale the `android` job of ci.yml already runs as part of `./gradlew build`).
# `--rerun` is required for the same reason `sync-exit-gate` requires it: build caching is on and
# `setup-gradle` restores the local build cache, so an unchanged test task would be restored
# FROM-CACHE and the gate would run nothing.
#
# Budget. **Measured**, on the owner's Windows workstation (24 logical CPUs; the harness caps its
# worker threads at 8), each figure one end-to-end run with exactly the gradle command below
# (§22.23 items 10 and 11): about 67 400 faulted runs (54 601 single crashes, 12 440 double
# crashes, 73 timeouts, 308 `SQLITE_FULL` injections) over **sixteen** scenario lines and suite
# cases (SCN-A, B, C, D, F, G, H, I, J, K, L, SCN-G's week-boundary retry as SCN-G-week, plus RP6,
# RP9, CB-reject-replay and EP-read-expiry, which is what `dm-report-check.sh` requires and what the
# fixtures carry), 128 seeded worlds and the mutants. Two runs of this gate, with byte-identical
# reports: **120 min 54 s** at S10c's first commit, beside other slices' builds, and **197 min 11 s**
# at the commit of S10c's review, with no other JVM on the machine at the two points it was looked
# at. The spread is the machine's, not the code's: SCN-H, 17 410 events in both, took 65 minutes of
# the second run where S10b's run of 17 284 took 31 (S10b's whole gate, fifteen lines before S13,
# was 72 min 51 s; nothing recorded how loaded the machine was for it). The PR scale took 9 min
# 48 s, 11 min 24 s and 17 min 56 s on the same machine. **Not measured** when this was written:
# this job, on a runner (what the runners showed since is below). On a 4-vCPU runner the
# harness runs 4 threads instead of 8, so an **extrapolation** — not a measurement — is about
# twice the workstation's harness time: roughly 240 minutes from the first figure and 395 from the
# second, plus the Rust and Gradle builds and whatever the slower cores cost. The old 240-minute
# timeout was at or below that on both, so it is 480 minutes now; the figure has to be measured on
# the runner before any timeout is trusted (§22.23 item 11(f)).
#
# **Observed on the runners** (Phase 9 review GATES-1). Two runs passed the harness before SCN-E and
# the suite cases landed (b918242 in 5 h 47 min, 4b343e3 in 4 h 07 min; both jobs then failed at the
# artifact upload). The next three — 35965999870 and 35977131413 on 7f33d4c, 35983745567 on f21f534 —
# were cancelled at the 480-minute limit, three copies of this job overlapping on the four runners of
# one laptop from 10:40 to 14:55 on 2026-09-24. Then, on d9ff300 (read after the review, design
# §22.33 item 1), the whole gate with SCN-E and the suite cases finished twice and passed the harness
# and the report check, red only at the artifact upload: push run 36092262408 (harness step 5 h 15 min)
# and nightly 36116534377 (job 4 h 25 min), overlapping by 12 minutes. `concurrency` below keeps one
# run per trigger kind at a time (a newer push waits, and replaces a push already waiting); sharding
# the job, as `entitlement-exit-gate` is sharded, is the owner's call (design §22.34).
#
# Heap. The test JVM's heap is `-Dghost.dm.heap`, default 2 GB (`messaging/build.gradle.kts`, design
# §22.33 item 3); every run above had Gradle's default of 512 MB, which this gate's crash enumeration
# fitted and the gate-scale privacy world did not. This gate passes no heap and takes the default.
#
# Supply chain (ci.yml rules): every action pinned by full commit SHA (the comment names the tag).
on:
  push:
    branches: [main]
  pull_request:
    paths:
      - "ghost/android/messaging/**"
      - "ghost/android/crypto-bridge/**"
      - "ghost/android/storage/**"
      - "ghost/android/sync/**"
      # SCN-E's entitlement world (§22.22, §22.25) runs the real `:entitlement` engine over the
      # `:network` port, so a change to either reaches its lines in the report.
      - "ghost/android/entitlement/**"
      - "ghost/android/network/**"
      # `:messaging` depends on `:identity` for `ZBase32` (the `ghost://contact/` link of §3.3), so
      # a change there reaches every world this gate runs and has to trigger it on a PR too.
      - "ghost/android/identity/**"
      - "ghost/client-core/dm/**"
      - "ghost/client-core/dm-host/**"
      - "ghost/scripts/gates/dm-report-check.sh"
      - ".github/workflows/messaging-exit-gate.yml"
  schedule:
    - cron: "43 3 * * *"
  workflow_dispatch:

permissions:
  contents: read

# One run per trigger kind at a time (see "Observed on the runners"): overlapping 8-hour copies of
# this job on the shared runners were cancelled at the job limit. Not cancel-in-progress: a run that
# has started finishes, and the newest waiting push is the one that runs next.
concurrency:
  group: messaging-exit-gate-${{ github.event_name }}
  cancel-in-progress: false

defaults:
  run:
    shell: bash

env:
  # The same package list as ci.yml, so this gate and the `android` job build with one SDK.
  ANDROID_PACKAGES: "platform-tools platforms;android-37.0 platforms;android-37.2 build-tools;37.0.0 build-tools;36.0.0"

jobs:
  gate:
    name: DM exit gate (crash enumeration at every event, seeded worlds, mutants)
    runs-on: [self-hosted, linux, x64, ghost]
    # See "Budget" above: the extrapolation from both measured runs reaches or passes 240 minutes.
    timeout-minutes: 480
    defaults:
      run:
        shell: bash
        working-directory: ghost/android
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: android-actions/setup-android@9fc6c4e9069bf8d3d10b2204b1fb8f6ef7065407 # v3
        with:
          packages: ${{ env.ANDROID_PACKAGES }}
      - name: validate gradle wrapper checksum
        uses: gradle/actions/wrapper-validation@ed408507eac070d1f99cc633dbcf757c94c7933a # v4
      - uses: gradle/actions/setup-gradle@ed408507eac070d1f99cc633dbcf757c94c7933a # v4
        with:
          cache-read-only: ${{ github.ref != 'refs/heads/main' }}
      - uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87 # stable branch
        with:
          toolchain: 1.98.1
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
        with:
          workspaces: ghost
      # The same host build the `android` job of ci.yml makes, for the same reason (§2.7, §15.1,
      # evidence V-5): every world of this gate runs the real ratchet, the real seal and the real
      # X-Wing through the closed JNI surface.
      # G-R3 (Phase 9 design §16.1, §22.33): a client build too — cleaned first, its cargo messages
      # read by the portable-libcrux detector before the library is loaded.
      - name: build ghost-dm-host (the DM host library the JVM tests load)
        working-directory: ghost
        run: |
          cargo clean -p libcrux-ml-kem -p libcrux-sha3 -p libcrux-intrinsics -p libcrux-aes --release || true
          cargo build -p ghost-dm-host --release --locked --message-format=json-render-diagnostics > "$RUNNER_TEMP/dm-host-build.json"
          bash scripts/gates/libcrux-portable.sh --with-aes --json "$RUNNER_TEMP/dm-host-build.json"
          echo "GHOST_DM_NATIVE=$PWD/target/release/libghost_dm_host.so" >> "$GITHUB_ENV"
      # G-R6 (host half, §22.8.10 point 10): the library this gate is about to load exports exactly
      # the closed list of §2.6, checked before it is loaded rather than after. `--test`: the host
      # build also exports the equivalence-test entry point (§15.9 item 7; slice S12), and only that.
      - name: G-R6 closed JNI surface (the host build)
        working-directory: ghost
        run: bash scripts/gates/dm-jni-surface.sh --test "$GHOST_DM_NATIVE"
      # G-M6 (Phase 10 slice S2b; its review): the host library carries the channel surface too, which
      # G-R6 accepts by class; G-M6 checks it exactly, wherever G-R6 reads a library.
      - name: G-M6 closed channel JNI surface (the host build)
        working-directory: ghost
        run: bash scripts/gates/mls-jni-surface.sh --test "$GHOST_DM_NATIVE"
      # `-Dghost.dm.privacy=off`: the privacy worlds of slice S11 are `dm-privacy-gate.yml`'s and the
      # `android` job's, which check their own report; this gate neither runs nor checks them. That
      # is a deviation from §16.2, which lists the privacy mutants and the T34 seizure world under
      # this gate; §22.16 declares it.
      - name: DM exit-gate harness (every event, 64 seeds)
        run: |
          ./gradlew --no-daemon :messaging:testDebugUnitTest --rerun \
            -Dghost.dm.native="$GHOST_DM_NATIVE" \
            -Dghost.dm.crash=full \
            -Dghost.dm.seeds=64 \
            -Dghost.dm.privacy=off
      - name: job summary and report check
        if: always()
        run: |
          report=messaging/build/reports/dm/report.txt
          {
            echo "## DM exit gate"
            echo
            echo '```'
            cat "$report" 2>/dev/null || echo "no DM harness report was written"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
          bash ../scripts/gates/dm-report-check.sh "$report" gate
      # A failed test's message and stack trace in the job summary (Phase 9 design §22.33): when the
      # upload below is refused, the job log alone said `java.sql.SQLException at …:33` and no more.
      - name: failed tests (job summary)
        if: failure()
        run: bash ../scripts/ci/junit-failures.sh messaging/build/test-results/testDebugUnitTest >> "$GITHUB_STEP_SUMMARY"
      # Evidence, not a gate: an upload the artifact quota refuses must not turn the job red (§22.33).
      - name: upload the report and the test reports
        if: always()
        continue-on-error: true
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: messaging-exit-gate
          path: |
            ghost/android/messaging/build/reports/dm
            ghost/android/messaging/build/reports/tests
          if-no-files-found: error
          retention-days: 3
