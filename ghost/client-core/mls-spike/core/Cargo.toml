# Phase 10 S0 evidence tooling (not product code). See ../Cargo.toml and docs/design/faza10-s0-evidence.md.
[package]
name = "ghost-mls-spike"
description = "Phase 10 S0 evidence probe: OpenMLS 0.9.0 with the libcrux provider behind GHOST's storage adapter, signer and extensions (not shipped)"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true
license.workspace = true

[lib]
crate-type = ["rlib"]

[features]
default = []
# V10-9 only: OpenMLS's X-Wing suites (0x004D, 0x004F). Forbidden in every shipped graph (design
# §3.2, G-M2); enabled here to measure what Q2 would cost.
pq = [
    "openmls/draft-ietf-mls-pq-ciphersuites",
    "openmls_traits/draft-ietf-mls-pq-ciphersuites",
    "openmls_libcrux_crypto/draft-ietf-mls-pq-ciphersuites",
]
# V10-6 only: the process-global seeded stream behind getrandom 0.4's custom backend. Needs
# RUSTFLAGS='--cfg getrandom_backend="custom"' (scripts/v10-06-determinism.sh sets it).
det = ["dep:getrandom", "dep:rand_chacha"]

[dependencies]
openmls = { workspace = true }
openmls_traits = { workspace = true }
openmls_libcrux_crypto = { workspace = true }
ed25519-dalek = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
chacha20poly1305 = { workspace = true }
sha2 = { workspace = true }
hkdf = { workspace = true }
rayon = { workspace = true }
tls_codec = { workspace = true }
getrandom = { version = "=0.4.3", optional = true }
rand_chacha = { version = "=0.10.0", optional = true, default-features = false }

[dev-dependencies]
hex = { workspace = true }
argon2 = { workspace = true }

[[test]]
name = "v10_09_pq"
required-features = ["pq"]

[[example]]
name = "det_world"
required-features = ["det"]
