[package]
publish = false
name = "ghost-dm-host"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
description = "Test-only host build of the DM JNI surface, so JVM tests call the real ratchet on Linux and Windows (Phase 9 design faza9-dm.md §2.3, §2.7, §15.1; evidence V-5)"

[lib]
# A cdylib the JVM loads with `System.load` through `-Dghost.dm.native=<path>`. Never built for
# Android: on a device the same code is inside `libghost_client_net.so` (§2.3).
name = "ghost_dm_host"
crate-type = ["cdylib"]

[features]
# T35 over the DM worlds (design §14.1 T35, §15.5 PQ2; slice S11): `ghost-client-dm`'s `provenance`
# feature turns the PQ-B key-provenance assertion of every seal (`provenance::assert_seal`) into a
# runtime check, so a JVM world run against this build fails on the first seal whose key kind §9.3
# does not allow. Test builds only: this package is never built for Android, and the shipped
# `ghost-client-net` does not enable it (G-R2).
provenance = ["ghost-client-dm/provenance"]

[dependencies]
# The whole point of this package: the JVM tests run the shipped crate, not a stand-in.
ghost-client-dm = { path = "../dm", features = ["jni-bridge"] }
jni = { workspace = true }
