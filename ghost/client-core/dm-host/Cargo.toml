[package]
publish = false
name = "ghost-dm-host"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
description = "Test-only host build of the DM and channel JNI surfaces, so JVM tests call the real ratchet and the real OpenMLS on Linux and Windows (Phase 9 design faza9-dm.md §2.3, §2.7, §15.1; evidence V-5; Phase 10 design faza10-forum.md §10.1), and the emulator's equivalence test library (§15.9 item 7)"

[lib]
# A cdylib the JVM loads with `System.load` through `-Dghost.dm.native=<path>`. Never shipped: on a
# device the same code is inside `libghost_client_net.so` (§2.3). Cross-compiled for
# `x86_64-linux-android` it is the emulator's **test library** of §15.9 item 7 (§22.8.10 point 6),
# packaged only in `:crypto-bridge`'s `androidTest` APK.
name = "ghost_dm_host"
crate-type = ["cdylib"]

[features]
# T35 over the DM worlds (design §14.1 T35, §15.5 PQ2; slice S11): `ghost-client-dm`'s `provenance`
# feature turns the PQ-B key-provenance assertion of every seal (`provenance::assert_seal`) into a
# runtime check, so a JVM world run against this build fails on the first seal whose key kind §9.3
# does not allow. Test builds only: this package is never shipped (its one Android build is the
# emulator's x86_64 test library, dm-emulator.yml, which does not enable this feature), and
# the shipped `ghost-client-net` does not enable it (G-R2).
provenance = ["ghost-client-dm/provenance"]

[dependencies]
# The whole point of this package: the JVM tests run the shipped crate, not a stand-in. Two
# additions, neither in the shipped graph (G-R2):
#  - `test-vectors`, the deterministic equivalence entry point (slice S12); G-R6 checks this library
#    exports it and the shipped one does not;
#  - `pq-spy`, PQ1 as an assertion around every `openIntro` (design §15.5 PQ1, §22.20): exactly one
#    X-Wing decapsulation and one inner key per open, and the same open run again with one bit of
#    the decapsulated secret flipped must be `NOT_OPEN`. It changes no output — a violation is a
#    caught panic, `INTERNAL`, which fails the JVM world that made the call — and adds no symbol,
#    so every JVM world opens its intros under PQ1. `DmPqSpyNativeTest` checks the loaded library
#    carries it.
ghost-client-dm = { path = "../dm", features = ["jni-bridge", "test-vectors", "pq-spy"] }
# The channel surface (Phase 10 design §10.1, slice S2b): `MlsNative` exported from this library
# too, so the JVM tests load one host library and call exactly the shipped channel code, plus its
# one test-vectors entry point (`MlsVectors.run`, the JDK vector replay of §12.2), which G-M6 checks
# this library exports and no shipped one does. G-M2 keeps `test-vectors` out of every shipped graph.
ghost-client-mls = { path = "../mls", features = ["jni-bridge", "test-vectors"] }
# The update surface (Phase 14 design §9.3, §11.2; slice S6): `UpdateNative`/`TorMirrorTransport`
# are exported from this library too, so the JVM update world loads one host library and calls
# exactly the shipped update code (the §9.2 decision core, the bundle/offer/accept path, the
# streaming APK check). The exports are `client-core/net`'s own, unconditional in the crate — no
# feature, so the shipped graph (G-R2's allowlist) is untouched: only this never-shipped package
# links them for tests. Net also invokes the closed DM/media/channel export macros itself, so this
# crate must NOT invoke them a second time (duplicate symbols); it adds only the test entries.
ghost-client-net = { path = "../net" }
jni = { workspace = true }
