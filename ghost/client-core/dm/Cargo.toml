[package]
publish = false
name = "ghost-client-dm"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
description = "GHOST direct messages: derivations, contact card v2, the four seal modes, the X-Wing intro layer, binding v3, the L0 codec, safety numbers and state wrapping (Phase 9 design faza9-dm.md §2-§9)"

[lib]
crate-type = ["rlib"]

[features]
# G-R2: no default feature. `provenance` turns the PQ-B key-provenance assertions of T35 (§9.3)
# into runtime checks outside `cfg(test)`; the crate's own unit tests get them unconditionally.
default = []
provenance = []
# The closed JNI surface of §2.6 and the `export_jni!` macro `ghost-client-net` and
# `ghost-dm-host` invoke (§2.3). Off by default so the crate stays testable without a JVM.
jni-bridge = ["dep:jni"]
# The host/Android equivalence entry point of §15.9 item 7 (§22.8.10 point 6, slice S12): the
# deterministic case runner `equivalence::run` and, with `jni-bridge`, the one extra JNI symbol
# `Java_org_ghost_crypto_bridge_DmEquivalence_run`. Only `ghost-dm-host` enables it — the library
# the JVM tests load and, built for `x86_64-linux-android`, the emulator's test library. G-R2 keeps
# it out of every shipped graph; G-R6 checks that no shipped library exports its symbol.
test-vectors = []
# PQ1's spy (§15.5 PQ1, §22.20): `pq::spy` counts every X-Wing decapsulation and encapsulation per
# thread and can perturb the next shared secret, and `jni.rs` runs PQ1 as an assertion around every
# `openIntro` (exactly one decapsulation; `NOT_OPEN` once the secret is perturbed). The crate's own
# tests get the spy unconditionally; only `ghost-dm-host` enables the feature, so every JVM world
# opens its intros under the assertion. G-R2 keeps it out of every shipped graph (its allowed list
# for this crate is `default` and `jni-bridge`).
pq-spy = []

[[test]]
name = "equivalence"
required-features = ["test-vectors"]

[dependencies]
# Olm (design §2.1, §2.3, D1; ADR-35). `default-features = false` drops `libolm-compat` and
# `precomputed-tables`; `low-level-api`, `experimental-session-config` and `insecure-pk-encryption`
# are forbidden in every shipped graph (G-R2) and appear only as dev features of the key-schedule
# oracle. Used through public API only, except the recorded pickle-layout deviation of §2.1
# (`src/olm/pickle.rs`).
vodozemac = { version = "=0.11.0", default-features = false }
# The session pickle and its sidecar (§7.9, §7.7 point 4); already a vodozemac dependency.
serde_json = { workspace = true }
# Exact pins (design §2.3, §16.3, ADR-36). X-Wing is reached only through `libcrux_kem::XWing` and
# the `libcrux_traits::kem::slice::Kem` trait; the enum API panics on short inputs and links every
# KEM of the crate (+415 KB arm64-v8a, +514 KB x86_64; evidence V-6, V-9).
libcrux-kem = { version = "=0.0.9", default-features = false }
libcrux-traits = { version = "=0.0.8", default-features = false }
# The slice trait performs no ML-KEM input check, so `mlkem768::validate_public_key` is called
# explicitly on the first 1 184 bytes of every encapsulation key (evidence V-6).
libcrux-ml-kem = { version = "=0.0.10", default-features = false, features = ["mlkem768"] }
# The seal AEAD and the state-wrapping envelopes (§6.2, §2.5); the version vodozemac 0.11.0 brings
# in S4b, taken directly here.
chacha20poly1305 = { version = "=0.11.0", default-features = false, features = ["alloc"] }
hkdf = "=0.13.0"
# The contributory X25519 trial of the whole-key validation (§22.8.2 rule 3).
x25519-dalek = "=2.0.1"
zeroize = { version = "=1.9.0", features = ["zeroize_derive"] }
# Workspace baseline (spec Appendix A): the versions the lock already carries.
sha2 = { workspace = true }
hmac = { workspace = true }
rand = { workspace = true }
ed25519-dalek = { workspace = true }
# The closed JNI surface (§2.6), behind `jni-bridge`; the version `ghost-client-net` already uses.
jni = { workspace = true, optional = true }

[dev-dependencies]
hex = { workspace = true }
# The 8-torsion u-coordinates of the low-order key tests (§22.8.2 rule 3), dev graph only.
curve25519-dalek = { workspace = true }
# Differential oracle for X-Wing, dev graph only (G-R1, §16.3).
x-wing = "=0.1.0"
# The Olm key-schedule oracle (design §15.2 item 3): vodozemac's `low-level-api` exports the
# message key, and the oracle re-derives `HKDF(salt = 0x00, M, "OLM_KEYS", 80)` and decrypts the
# golden ciphertext with AES-256-CBC, checking the **8-byte** V1 MAC. Dev graph only: G-R2 keeps
# `low-level-api` out of every shipped graph, and `aes`/`cbc` are already in the lock through
# vodozemac itself, so the oracle adds no crate to the shipped library.
vodozemac = { version = "=0.11.0", default-features = false, features = ["low-level-api"] }
aes = "=0.9.3"
cbc = "=0.2.1"
