# cargo-deny configuration (ADR-06, ADR-10). Run: cargo deny check
[graph]
all-features = true

[advisories]
version = 2
yanked = "deny"
ignore = [
    # Two rsa versions, two scopes (ADR-22, Phase 8 design §2.8, §14.1):
    #  - rsa 0.9.10 is a dependency of Arti crates only (tor-llcrypto, tor-key-forge,
    #    ssh-key-fork-arti). In the client, RSA is used only for PKCS#1 v1.5 *signature
    #    verification* (channel crosscerts, directory authority certificates, consensus); nothing
    #    enabled generates or uses an RSA private key: relay / onion-service-service / arti-relay /
    #    tor-hsservice are not in the client graph, and Arti's native keystore (compiled in through
    #    tor-chanmgr) stays empty, which the client tests check (unit and live-tor).
    #  - rsa 0.10.0-rc.18 (hazmat rsa_decrypt_and_check on crypto-bigint 0.7.5) is reached only
    #    through blind-rsa-signatures =0.17.2 in ghost-issuer (and ghost-issuer-ops): the blind
    #    signer. It is payment-gated, every blind signature is re-checked (s'^e == B) by GHOST code
    #    before release, and replies leave on a 2 s quantum. A blind signer returns B^d to whoever
    #    asks by design, so Marvin's decryption-oracle class adds nothing; the residual
    #    exponent-timing key-recovery risk is mitigated as ADR-22 states. Base blinding carries the
    #    timing claim: the nightly Welch t-test asserts that the private-key operation's time does
    #    not depend on the blinded value, and it measures the crypto-bigint CRT exponentiation on an
    #    unblinded base as dependent on it (design §19.30).
    # scripts/gates/rust-feature-policy.sh enforces both scopes per version (and keeps the issuer
    # crates out of the client and relay graphs); scripts/gates/rust-crypto-pins.sh pins the exact
    # versions per graph. Re-review this entry when rsa 0.10.0 is final or either scope changes.
    # Reviewed 2026-09-11 (Phase 6 security review), 2026-09-12 (Phase 8 design review),
    # 2026-09-16 (signer timing, issue #1, design §19.30).
    { id = "RUSTSEC-2023-0071", reason = "rsa 0.9.10: verification only, inside Arti (client). rsa 0.10.0-rc.18: only through blind-rsa-signatures in ghost-issuer and ghost-issuer-ops (base-blinded crypto-bigint path, the private-key operation's time independent of the blinded value by the nightly Welch t-test, signer-timing.yml, design §19.30, while the unblinded CRT exponentiation is not constant-time in its base; BlindSign and RedeemInvite gated by a paid invoice or a valid invite, RefreshCredit not gated but bounded per credit epoch by its paid packs, design §19.27; independently fault-checked; 2 s reply quantum). A blind signer returns B^d by design, so the Marvin decryption-oracle class adds nothing; the residual exponent-timing risk is mitigated as stated in ADR-22. rust-feature-policy.sh and rust-crypto-pins.sh enforce both scopes. Re-review when rsa 0.10.0 is final." },
    # `paste` is a proc-macro used at build time only by arti's dependency tree; no runtime code.
    { id = "RUSTSEC-2024-0436", reason = "paste: build-time proc-macro, unmaintained but inert" },
    # Phase 9 DM stack (ADR-36; design faza9-dm.md §16.3, evidence faza9-s0-evidence.md V-6, correction
    # S0-6 point 4, recorded 2026-09-19). `proc-macro-error2` is unmaintained and is reached only as
    # proc-macro-error2 2.0.1 <- hax-lib-macros 0.3.7 (proc-macro) <- hax-lib 0.3.7 <- libcrux-intrinsics,
    # libcrux-ml-kem, libcrux-secrets: build-time code, nothing of it is linked into the shipped library.
    # It was the only cargo-deny failure over the DM graph (licenses ok, bans ok, sources ok). S0' measured
    # it on its spike (ghost/client-core/dm-spike, its own [workspace] and Cargo.lock, deleted by the S0'
    # gate slice, design §22.33); the libcrux graph entered this workspace with ghost-client-dm in S4a,
    # where the entry now applies.
    { id = "RUSTSEC-2026-0173", reason = "proc-macro-error2 (unmaintained) reached only through the hax-lib-macros proc-macro of the libcrux graph: build-time code, nothing linked; re-review at every libcrux or hax-lib bump (ADR-36, design faza9-dm.md §16.3, V-6)" },
]

[licenses]
version = 2
# Unused pre-approvals are refused so a new dependency cannot slip in under a license nobody
# reviewed for this project. GHOST itself is proprietary (owner decision 2026-09-16, root LICENSE;
# ADR-37): no GPL, LGPL or AGPL component may enter a shipped graph. MPL-2.0 is allowed only for
# components used unmodified, with their source offered (ADR-37 point 2; today option-ext and
# priority-queue through Arti, gate G-L4 scripts/gates/mpl-sources.sh). The same list decides the
# licence under which the notices generator uses each component (scripts/gates/licenses.pl).
unused-allowed-license = "deny"
allow = [
    "MIT",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "ISC",
    "Unicode-3.0",
    "Zlib",
    "MPL-2.0",
    "Unlicense",
    "CC0-1.0",
]
confidence-threshold = 0.9

# GHOST workspace crates are unpublished (publish = false) and carry LicenseRef-GHOST-Proprietary;
# their licence is the root LICENSE, not a dependency licence to vet.
[licenses.private]
ignore = true

[bans]
multiple-versions = "warn"
wildcards = "deny"
# Workspace-internal path dependencies carry no version by design.
allow-wildcard-paths = true
deny = [
    # ADR-06: no third-party crash/telemetry SDKs.
    { crate = "sentry", reason = "ADR-06: no third-party crash/telemetry SDKs" },
    { crate = "sentry-core", reason = "ADR-06" },
    { crate = "bugsnag", reason = "ADR-06" },
    { crate = "opentelemetry", reason = "ADR-06: telemetry" },
    { crate = "opentelemetry-otlp", reason = "ADR-06: telemetry export" },
    # ADR-01: no general-purpose HTTP clients that could open clearnet connections outside the
    # onion-only transport in client-core/net.
    { crate = "reqwest", reason = "ADR-01: clearnet-capable HTTP client" },
    { crate = "ureq", reason = "ADR-01" },
    { crate = "isahc", reason = "ADR-01" },
    { crate = "surf", reason = "ADR-01" },
    { crate = "attohttpc", reason = "ADR-01" },
    { crate = "curl", reason = "ADR-01" },
    # ADR-37 (Phase 9 design §2.10.2, §22.8.10 point 1): libsignal and its family are AGPL-3.0 (or
    # carry AGPL sources under another declared licence, wacore-libsignal); GHOST is closed source.
    # cargo-deny takes package specs, not globs, so every name is spelled out; self-test.sh puts one
    # of them into a scratch lock file and expects "bans FAILED". unknown-git = "deny" below stays
    # the main defence against a git dependency under another name.
    { crate = "libsignal-protocol", reason = "ADR-37: AGPL-3.0 (libsignal)" },
    { crate = "libsignal-core", reason = "ADR-37: AGPL-3.0 (libsignal)" },
    { crate = "libsignal-net", reason = "ADR-37: AGPL-3.0 (libsignal)" },
    { crate = "libsignal-service", reason = "ADR-37: AGPL-3.0 (libsignal)" },
    { crate = "libsignal-jni", reason = "ADR-37: AGPL-3.0 (libsignal)" },
    { crate = "libsignal-ffi", reason = "ADR-37: AGPL-3.0 (libsignal)" },
    { crate = "signal-crypto", reason = "ADR-37: AGPL-3.0 (libsignal)" },
    { crate = "zkgroup", reason = "ADR-37: AGPL-3.0 (libsignal)" },
    { crate = "spqr", reason = "ADR-37: AGPL-3.0 (SparsePostQuantumRatchet)" },
    { crate = "spqr-syft", reason = "ADR-37: AGPL-3.0 (SparsePostQuantumRatchet)" },
    { crate = "pq-ratchet", reason = "ADR-37: AGPL-3.0" },
    { crate = "libsignal-dezire", reason = "ADR-37: libsignal family" },
    { crate = "wacore-libsignal", reason = "ADR-37: declared MIT, sources AGPL-3.0-only with Signal Messenger headers" },
    { crate = "wa-rs-libsignal", reason = "ADR-37: libsignal family" },
]

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
