# cargo-deny configuration (ADR-06, ADR-10). Run: cargo deny check
[graph]
all-features = true

[advisories]
version = 2
yanked = "deny"
ignore = [
    # Two rsa versions, two scopes (ADR-22, Phase 8 design §2.8, §14.1):
    #  - rsa 0.9.10 is a dependency of Arti crates only (tor-llcrypto, tor-key-forge,
    #    ssh-key-fork-arti). In the client, RSA is used only for PKCS#1 v1.5 *signature
    #    verification* (channel crosscerts, directory authority certificates, consensus); nothing
    #    enabled generates or uses an RSA private key: relay / onion-service-service / arti-relay /
    #    tor-hsservice are not in the client graph, and Arti's native keystore (compiled in through
    #    tor-chanmgr) stays empty, which the client tests check (unit and live-tor).
    #  - rsa 0.10.0-rc.18 (hazmat rsa_decrypt_and_check on crypto-bigint 0.7.5) is reached only
    #    through blind-rsa-signatures =0.17.2 in ghost-issuer (and ghost-issuer-ops): the blind
    #    signer. It is payment-gated, every blind signature is re-checked (s'^e == B) by GHOST code
    #    before release, and replies leave on a 2 s quantum. A blind signer returns B^d to whoever
    #    asks by design, so Marvin's decryption-oracle class adds nothing; the residual
    #    exponent-timing key-recovery risk is mitigated as ADR-22 states.
    # scripts/gates/rust-feature-policy.sh enforces both scopes per version (and keeps the issuer
    # crates out of the client and relay graphs); scripts/gates/rust-crypto-pins.sh pins the exact
    # versions per graph. Re-review this entry when rsa 0.10.0 is final or either scope changes.
    # Reviewed 2026-09-11 (Phase 6 security review), 2026-09-12 (Phase 8 design review).
    { id = "RUSTSEC-2023-0071", reason = "rsa 0.9.10: verification only, inside Arti (client). rsa 0.10.0-rc.18: only through blind-rsa-signatures in ghost-issuer and ghost-issuer-ops (constant-time crypto-bigint path; payment-gated, independently fault-checked, 2 s reply quantum). A blind signer returns B^d by design, so the Marvin decryption-oracle class adds nothing; the residual exponent-timing risk is mitigated as stated in ADR-22. rust-feature-policy.sh and rust-crypto-pins.sh enforce both scopes. Re-review when rsa 0.10.0 is final." },
    # `paste` is a proc-macro used at build time only by arti's dependency tree; no runtime code.
    { id = "RUSTSEC-2024-0436", reason = "paste: build-time proc-macro, unmaintained but inert" },
]

[licenses]
version = 2
# Unused pre-approvals are refused so a new dependency cannot slip in under a license nobody
# reviewed for this project (ADR-07 client license still open).
unused-allowed-license = "deny"
allow = [
    "MIT",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "ISC",
    "Unicode-3.0",
    "Zlib",
    "MPL-2.0",
    "Unlicense",
    "CC0-1.0",
]
confidence-threshold = 0.9

[bans]
multiple-versions = "warn"
wildcards = "deny"
# Workspace-internal path dependencies carry no version by design.
allow-wildcard-paths = true
deny = [
    # ADR-06: no third-party crash/telemetry SDKs.
    { crate = "sentry", reason = "ADR-06: no third-party crash/telemetry SDKs" },
    { crate = "sentry-core", reason = "ADR-06" },
    { crate = "bugsnag", reason = "ADR-06" },
    { crate = "opentelemetry", reason = "ADR-06: telemetry" },
    { crate = "opentelemetry-otlp", reason = "ADR-06: telemetry export" },
    # ADR-01: no general-purpose HTTP clients that could open clearnet connections outside the
    # onion-only transport in client-core/net.
    { crate = "reqwest", reason = "ADR-01: clearnet-capable HTTP client" },
    { crate = "ureq", reason = "ADR-01" },
    { crate = "isahc", reason = "ADR-01" },
    { crate = "surf", reason = "ADR-01" },
    { crate = "attohttpc", reason = "ADR-01" },
    { crate = "curl", reason = "ADR-01" },
]

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
