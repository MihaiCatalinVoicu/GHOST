# cargo-deny configuration (ADR-06, ADR-10). Run: cargo deny check
[graph]
all-features = true

[advisories]
version = 2
yanked = "deny"
ignore = [
    # Transitive via arti (tor-keymgr -> ssh-key fork -> rsa). GHOST never uses RSA key material
    # from Arti's keystore; the Marvin timing side channel needs an RSA decryption oracle. Tracked
    # for removal when arti drops the dependency. Reviewed 2026-09-10 (Phase 6).
    { id = "RUSTSEC-2023-0071", reason = "rsa: unreachable in GHOST usage; transitive via arti keymgr" },
    # `paste` is a proc-macro used at build time only by arti's dependency tree; no runtime code.
    { id = "RUSTSEC-2024-0436", reason = "paste: build-time proc-macro, unmaintained but inert" },
]

[licenses]
version = 2
allow = [
    "MIT",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "ISC",
    "Unicode-3.0",
    "Zlib",
    "MPL-2.0",
    "Unlicense",
    "CC0-1.0",
    "BSL-1.0",
    "OpenSSL",
]
confidence-threshold = 0.9

[bans]
multiple-versions = "warn"
wildcards = "deny"
# Workspace-internal path dependencies carry no version by design.
allow-wildcard-paths = true
deny = [
    # No telemetry/analytics crates, no clearnet-only HTTP clients without Tor routing decided by ADR.
    { crate = "sentry", reason = "ADR-06: no third-party crash/telemetry SDKs" },
    { crate = "sentry-core", reason = "ADR-06" },
]

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
