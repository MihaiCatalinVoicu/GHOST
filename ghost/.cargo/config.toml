# Portable libcrux for every build of this workspace (Phase 9 design §2.3, Q55, gate G-R3): only
# the ML-KEM and SHA-3 code the hax/F* proofs target is linked; NEON has no proofs and
# RUSTSEC-2025-0133 was an unverified aarch64 fallback.
#
# These variables are not the mechanism the gate trusts. `libcrux-ml-kem`, `libcrux-sha3` and
# `libcrux-intrinsics` read them in `build.rs` without `cargo:rerun-if-env-changed`, so setting or
# clearing them in an existing target directory does not re-run the build scripts and the previous
# SIMD cfgs are reused (measured in S0', evidence V-6 §6.3: FAIL -> FAIL -> portable after a clean
# -> still portable after the reverse change). Every client build is therefore preceded by
#   cargo clean -p libcrux-ml-kem -p libcrux-sha3 -p libcrux-intrinsics [--target <triple>] --release
# which also covers target directories restored from CI caches, and G-R3 reads the `cargo:rustc-cfg`
# lines of the build it guards.
[env]
LIBCRUX_DISABLE_SIMD128 = "1"
LIBCRUX_DISABLE_SIMD256 = "1"
