# Pinned implementation baseline (spec v2.0 Appendix A). Every bump goes through the dependency
# allowlist gate (scripts/gates/dependency-allowlist.sh) and Gradle dependency verification.
[versions]
agp = "9.4.0"
kotlin = "2.4.20"
compileSdk = "37"
minSdk = "29"
targetSdk = "37"
composeBom = "2026.09.00"
activityCompose = "1.13.0"
coreKtx = "1.19.0"
lifecycle = "2.11.0"
work = "2.11.2"
# Phase 11 design §16.3 / Q14: Media3 pinned at 1.11.1 (the S0 spike's version; the 1.11.0 line
# never resolved). Every module GHOST uses is declared below.
media3 = "1.11.1"
sqlcipher = "4.19.0"
androidxSqlite = "2.7.1"
sqliteJdbc = "3.53.4.0"
bouncycastle = "1.85.2"
zxing = "3.5.4"
junit = "4.13.2"

[libraries]
androidx-core-ktx = { group = "androidx.core", name = "core-ktx", version.ref = "coreKtx" }
androidx-activity-compose = { group = "androidx.activity", name = "activity-compose", version.ref = "activityCompose" }
androidx-lifecycle-runtime-ktx = { group = "androidx.lifecycle", name = "lifecycle-runtime-ktx", version.ref = "lifecycle" }
# ProcessLifecycleOwner for the sync foreground session (Phase 7 design §11.2 #21, ADR-20). Already
# shipped transitively; declared so the app's direct use is explicit.
androidx-lifecycle-process = { group = "androidx.lifecycle", name = "lifecycle-process", version.ref = "lifecycle" }
androidx-compose-bom = { group = "androidx.compose", name = "compose-bom", version.ref = "composeBom" }
androidx-compose-ui = { group = "androidx.compose.ui", name = "ui" }
androidx-compose-ui-tooling-preview = { group = "androidx.compose.ui", name = "ui-tooling-preview" }
androidx-compose-material3 = { group = "androidx.compose.material3", name = "material3" }
androidx-work-runtime-ktx = { group = "androidx.work", name = "work-runtime-ktx", version.ref = "work" }
androidx-media3-exoplayer = { group = "androidx.media3", name = "media3-exoplayer", version.ref = "media3" }
# Phase 11 §13.1 (slice S5): the sender pipeline's Media3 modules — Transformer (the export),
# muxer (`FragmentedMp4Muxer`, behind `GhostMuxer`), effect (`Presentation`, `FrameDropEffect`),
# common (`Format`, `ColorInfo`), datasource (`ContentDataSource`, the picked source read).
androidx-media3-transformer = { group = "androidx.media3", name = "media3-transformer", version.ref = "media3" }
androidx-media3-muxer = { group = "androidx.media3", name = "media3-muxer", version.ref = "media3" }
androidx-media3-effect = { group = "androidx.media3", name = "media3-effect", version.ref = "media3" }
androidx-media3-common = { group = "androidx.media3", name = "media3-common", version.ref = "media3" }
androidx-media3-datasource = { group = "androidx.media3", name = "media3-datasource", version.ref = "media3" }
sqlcipher-android = { group = "net.zetetic", name = "sqlcipher-android", version.ref = "sqlcipher" }
androidx-sqlite = { group = "androidx.sqlite", name = "sqlite", version.ref = "androidxSqlite" }
androidx-sqlite-framework = { group = "androidx.sqlite", name = "sqlite-framework", version.ref = "androidxSqlite" }
sqlite-jdbc = { group = "org.xerial", name = "sqlite-jdbc", version.ref = "sqliteJdbc" }
bouncycastle-bcprov = { group = "org.bouncycastle", name = "bcprov-jdk18on", version.ref = "bouncycastle" }
junit = { group = "junit", name = "junit", version.ref = "junit" }

zxing-core = { group = "com.google.zxing", name = "core", version.ref = "zxing" }

[plugins]
android-application = { id = "com.android.application", version.ref = "agp" }
android-library = { id = "com.android.library", version.ref = "agp" }
kotlin-compose = { id = "org.jetbrains.kotlin.plugin.compose", version.ref = "kotlin" }
