[workspace]
resolver = "2"
members = [
    "relay/crates/api",
    "relay/crates/storage",
    "relay/crates/transport",
    "relay/crates/gossip",
    "relay/crates/prune",
    "relay/crates/capability",
    "relay/crates/node",
    "issuer",
    "test-harness/privacy/capture-check",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "MIT OR Apache-2.0"
rust-version = "1.98"
repository = "https://github.com/MihaiCatalinVoicu/GHOST"

[workspace.dependencies]
# Pinned baseline (spec Appendix A). Bumps go through cargo-deny/cargo-audit in CI.
tonic = { version = "0.14.6", default-features = false, features = ["codegen", "transport", "server", "channel", "router"] }
tonic-prost = "0.14.6"
tonic-prost-build = "0.14.6"
prost = "0.14.4"
tokio = { version = "1.53.1", features = ["rt-multi-thread", "macros", "sync", "time", "net"] }
tokio-stream = { version = "0.1.19", features = ["net"] }
redb = "4.2.0"
sha2 = "0.11.0"
hmac = "0.13.0"
rand = "0.10.2"
hex = "0.4.3"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
thiserror = "2.0.20"
tempfile = "3.27.0"
