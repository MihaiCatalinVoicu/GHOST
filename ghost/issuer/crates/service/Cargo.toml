[package]
publish = false
name = "ghost-issuer"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
description = "GHOST entitlement issuer: blind-signed credentials over a Monero rail (ADR-02, ADR-05, ADR-22)"

[dependencies]
ghost-blind-rsa = { path = "../blind-rsa" }
ghost-entitlement = { path = "../entitlement" }
ghost-issuer-api = { path = "../api" }
# Reference signer (design §2.7, ADR-22): RFC 9474 co-author's implementation on the constant-time
# crypto-bigint path of rsa 0.10.0-rc.18. Only this graph (and ghost-issuer-ops) may link it.
blind-rsa-signatures = { workspace = true }
# Sealed per-epoch key files: ChaCha20-Poly1305 and HKDF-SHA256 from ring, no AEAD crate (§14.3);
# the operating-system random source for invoice ids.
ring = { workspace = true }
# Storage (design §6.1) and the journal checksum (§19.5: SHA-256, no CRC crate).
redb = { workspace = true }
sha2 = { workspace = true }
# The gRPC server (design §5.1, §6.7: loopback listener behind the onion service), the wall-clock
# facade (blocking pool, signing semaphore, reply quantum, §5.9, §2.8) and the periodic jobs.
tonic = { workspace = true, features = ["transport", "server", "router"] }
tokio = { workspace = true }
tokio-stream = { workspace = true }
# The Monero rail adapter (design §7.1, slice S5): JSON-RPC to monero-wallet-rpc and monerod on
# loopback, plain HTTP/1.1 through hyper's connection API, RFC 2617 digest with MD5 (ADR-26), and
# strict typed decoding of the answers.
hyper = { workspace = true, features = ["client", "http1"] }
hyper-util = { workspace = true }
http-body-util = { workspace = true }
md-5 = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
# The configuration file (design §6.6).
toml = { workspace = true }
# The ops key that signs payout batch files (design §9.5; Ed25519, already in the graph through
# ghost-entitlement's schedule verification). The tests also sign test schedules with it.
ed25519-dalek = { workspace = true }

[dev-dependencies]
# The gRPC client of the server test (a tonic Channel; test graph only).
tonic = { workspace = true, features = ["transport", "channel"] }
hex = { workspace = true }
# Independent HKDF-SHA256 (RFC 5869 over HMAC-SHA256) for the seal-key derivation test.
hmac = { workspace = true }
tempfile = { workspace = true }
# The ChainPort double builds valid regtest subaddresses (Keccak-256 checksum, Ed25519 points).
sha3 = { workspace = true }
curve25519-dalek = { workspace = true }
# Regtest step 14 and its in-process twin redeem pack tokens at an in-process relay (design
# §13.3 step 14). Test graph only: no relay crate is linked into the issuer.
ghost-relay-node = { path = "../../../relay/crates/node" }
ghost-relay-api = { path = "../../../relay/crates/api" }
ghost-relay-capability = { path = "../../../relay/crates/capability" }
