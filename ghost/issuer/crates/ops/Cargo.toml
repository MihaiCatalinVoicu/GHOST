[package]
publish = false
name = "ghost-issuer-ops"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
description = "GHOST issuer operator tools (offline): key ceremony, key load, Entitlement Schedule signing and verification (ADR-22, ADR-26)"

[[bin]]
name = "ghost-issuer-ops"
path = "src/main.rs"

[dependencies]
ghost-blind-rsa = { path = "../blind-rsa" }
ghost-entitlement = { path = "../entitlement" }
# The reference signer (key generation, permutation proofs) and the sealed key format (ADR-22:
# blind-rsa-signatures stays confined to ghost-issuer and ghost-issuer-ops).
ghost-issuer = { path = "../service" }
# Signs the Entitlement Schedule with the offline schedule key (design §3.1).
ed25519-dalek = { workspace = true }
# Operating-system randomness for the custody secret, the schedule key, onion service seeds and
# seal nonces.
ring = { workspace = true }
# SHA-512 of an onion service seed: the expanded Ed25519 secret key Tor stores (onion-keygen);
# SHA-256 of the payout ledger's salted hashes.
sha2 = { workspace = true }
# The payout workstation's saved wallet and daemon answers (view dump, transfer, key-image status),
# already in the graph through ghost-issuer's rail.
serde_json = { workspace = true }

[dev-dependencies]
tempfile = { workspace = true }
# The client's own onion address parser (its v3 checksum check runs through Arti's HsId): every
# onion-keygen host name must pass it.
ghost-client-net = { path = "../../../client-core/net", default-features = false }
# Arti's reader of C Tor's expanded Ed25519 secret key (ExpandedKeypair::from_secret_key_bytes, the
# function tor-keymgr's C Tor keystore applies to hs_ed25519_secret_key): every onion-keygen secret
# key file must load there into its public key.
tor-llcrypto = { version = "0.46.0", default-features = false }
