// GHOST blind relay wire schema, protocol version 1.
// Normative source: GHOST Technical Specification v2.0 §9.1, amended by ADR-01/ADR-09/ADR-11.
// Rules: every blob is opaque ciphertext of at most 65,536 serialized bytes; blob_hash is the
// SHA-256 of the exact ciphertext blob and is recomputed by the relay on store; unknown fields
// follow protobuf compatibility rules; an incompatible major version fails closed.
syntax = "proto3";

package ghost.relay.v1;

option java_package = "org.ghost.protocol.relay.v1";
option java_multiple_files = true;

// Maximum serialized blob size is 65,536 bytes (FR-5.1). Enforced by relays and clients.
// Padding buckets applied before onion wrapping: 1, 4, 16, 64 KiB (FR-2.5, P0 per ADR-09).

message Capability {
  // Opaque, unforgeable authorization token scoped to one or more namespaces/blobs.
  // Carries no user identity (FR-5.3, TB-2). Either a relay-minted capability (v1 or v2, MAC
  // under the relay key) or a bearer credential v3 (67 bytes: version 3, kind, relay slot,
  // namespace, secret) whose verifier the namespace's owner registered with RegisterKey (Phase 9
  // design §4.3): a read credential lists, gets and checks, a deposit credential stores and checks,
  // a fetch credential lists and gets.
  bytes token = 1;
}

message StoreBlobRequest {
  uint32 version = 1;          // protocol version; MUST be 1
  bytes blob_hash = 2;         // SHA-256 of `data`, exactly 32 bytes
  bytes data = 3;              // ciphertext, <= 65,536 bytes
  Capability capability = 4;   // write capability, or a deposit credential v3
  uint32 ttl_seconds = 5;      // exactly one bucket: 3600, 86400, 604800, 2592000 or 7776000
                               // seconds (1 h, 1 d, 7 d, 30 d, 90 d; FR-5.5, ADR-27, ADR-32);
                               // any other TTL is refused
  bytes request_id = 6;        // client-chosen idempotency key, 16 bytes
  bytes namespace_id = 7;      // opaque namespace (channel/inbox/prekeys), 32 bytes
}

message StoreBlobResponse {
  bool success = 1;
  bytes stored_hash = 2;
  uint64 expiry_unix_seconds = 3;
}

message GetBlobRequest {
  uint32 version = 1;
  bytes blob_hash = 2;
  Capability capability = 3;   // read capability for the namespace
  bytes request_id = 4;
}

message GetBlobResponse {
  bytes data = 1;
  // Coarse granularity as configured by relay policy: the minute for a relay-minted capability;
  // the start of its ISO week for a read or fetch credential v3 (Phase 9 design §21.9, §22.8.7).
  uint64 uploaded_at_unix_seconds = 2;
  // The hour-rounded expiry; for a fetch credential v3 rounded up to the next ISO week boundary.
  uint64 expiry_unix_seconds = 3;
}

message CheckBlobsRequest {
  uint32 version = 1;
  repeated bytes blob_hashes = 2;        // batch count bounded by relay policy
  Capability capability = 3;
}

message CheckBlobsResponse {
  repeated bytes available_hashes = 1;   // never enumerates outside capability scope
}

message ListNamespaceRequest {
  // Incremental history sync with opaque cursors (FR-3.5).
  uint32 version = 1;
  bytes namespace_id = 2;
  Capability capability = 3;
  bytes cursor = 4;                      // opaque; empty = from beginning
  uint32 limit = 5;                      // bounded by relay policy; fixed-size batches recommended
}

message ListNamespaceResponse {
  repeated bytes blob_hashes = 1;
  bytes next_cursor = 2;
}

message GossipInventoryBatch {
  // Relay-to-relay authenticated inventory exchange (FR-5.6). Carries no endpoint identity.
  uint32 version = 1;
  repeated bytes blob_hashes = 2;
  bytes batch_id = 3;
}

message GossipAck {
  bytes batch_id = 1;
  repeated bytes missing_hashes = 2;
}

// Relay redemption (Phase 8 design §10, ADR-25): a Privacy Pass type 0x0002 ACCESS token of the
// Entitlement Schedule, bound to this relay's slot and to one ISO week, buys one write capability
// v2 for one namespace. Protocol-meaningful outcomes travel in-band in `result`; malformed,
// forged, wrong-kind and wrong-slot tokens are one gRPC status (PERMISSION_DENIED).
enum RedeemResult {
  REDEEM_RESULT_UNSPECIFIED = 0;
  REDEEM_RESULT_OK = 1;
  REDEEM_RESULT_REPLAYED = 2;       // nullifier already bound to another namespace
  REDEEM_RESULT_WRONG_PERIOD = 3;   // outside the acceptance window; nothing recorded, the token stays spendable
}

message RedeemTokenRequest {
  uint32 version = 1;               // MUST be 1
  bytes token = 2;                  // 354 bytes, Privacy Pass type 0x0002, kind ACCESS for this relay's slot
  bytes namespace_id = 3;           // 32 bytes: the namespace the write capability is for
  bytes request_id = 4;             // 16 random bytes; identical on an identical retry (T1 field)
}

message RedeemTokenResponse {
  RedeemResult result = 1;
  Capability capability = 2;        // OK only: write capability v2 (98 bytes, design §10.3)
  uint64 relay_period_id = 3;       // always: the relay's current week (R9 clock source)
  uint64 relay_minute = 4;          // always: the relay's unix time / 60 (R9 clock source)
}

// Key registration (Phase 9 design §4.2–§4.6, ADR-30): the holder of a write capability for a
// namespace registers the verifier of a bearer secret, so that everyone presenting that secret as
// a credential v3 at this relay may read, deposit into or fetch from the namespace while the
// registration lives (until start(period + 2) + 3600). Registrations accumulate and are never
// replaced; one capability registers at most one verifier per (namespace, period, kind). The
// verifier is SHA-256(label(kind) || slot || namespace || secret); the secret never reaches the
// relay at registration. Forged, expired, foreign and conflicting registrations are one gRPC
// status (PERMISSION_DENIED).
enum KeyKind {
  KEY_KIND_UNSPECIFIED = 0;
  KEY_KIND_READ = 1;                // list, get, check
  KEY_KIND_DEPOSIT = 3;             // store, check (2 is Write in capability headers; never used here)
  KEY_KIND_FETCH = 4;               // list, get; get returns week-coarse uploaded_at and expiry
}

enum RegisterResult {
  REGISTER_RESULT_UNSPECIFIED = 0;
  REGISTER_RESULT_OK = 1;           // recorded, or an identical record already existed
  REGISTER_RESULT_WRONG_PERIOD = 2; // period not in {cap_week, cap_week + 1}; nothing recorded
}

message RegisterKeyRequest {
  uint32 version = 1;               // MUST be 1
  bytes namespace_id = 2;           // 32 bytes
  uint64 period_id = 3;             // ISO week of the key (Phase 8 period)
  KeyKind kind = 4;
  bytes verifier = 5;               // 32 bytes; the secret never reaches the relay at registration
  Capability capability = 6;        // a usable WRITE capability (v1 or v2) for namespace_id
  bytes request_id = 7;             // 16 random bytes, identical on an identical retry (T1 field)
}

message RegisterKeyResponse {
  RegisterResult result = 1;
  uint64 relay_period_id = 2;       // always (R9 relay-facing clock source, as RedeemToken)
  uint64 relay_minute = 3;          // always
  uint64 valid_until_unix = 4;      // OK only: when the relay forgets the record
}

service RelayService {
  rpc StoreBlob(StoreBlobRequest) returns (StoreBlobResponse);
  rpc GetBlob(GetBlobRequest) returns (GetBlobResponse);
  rpc CheckBlobs(CheckBlobsRequest) returns (CheckBlobsResponse);
  rpc ListNamespace(ListNamespaceRequest) returns (ListNamespaceResponse);
  rpc GossipSync(stream GossipInventoryBatch) returns (stream GossipAck);
  rpc RedeemToken(RedeemTokenRequest) returns (RedeemTokenResponse);
  rpc RegisterKey(RegisterKeyRequest) returns (RegisterKeyResponse);
}
