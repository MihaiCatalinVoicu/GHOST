[package]
publish = false
name = "ghost-verify"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
description = "GHOST public verifier (Phase 14 design §9.1): the §7.4 decision offline — apk (the bundle, the offer and the APK check per SDK class), later libs/fetch/operator/monitor. Built from the same ghost-client-update the app links; the public repository exports this crate with its source (Q28)."

[lib]
crate-type = ["rlib"]

[dependencies]
ghost-client-update = { path = "../../client-core/update" }
ghost-client-release = { path = "../../client-core/release" }
# Rule (d)'s engine input: the verified ES documents (`Schedule`, `ScheduleMemory`) whose
# append-only rule (ADR-22 rule 5) the monitor checks. Pure public-key verification, already in
# the shipped client graph through ghost-client-net; no issuer-side code.
ghost-entitlement = { path = "../../issuer/crates/entitlement" }
sha2 = { workspace = true }
hex = { workspace = true }
flate2 = "1.1.0"
ureq = { version = "3", default-features = false, features = ["rustls"] }

[dev-dependencies]
ghost-release-ops = { path = "../crates/ops" }
tempfile = { workspace = true }
sha3 = { workspace = true }
hex = { workspace = true }
# Signing the ES fixtures of rule (d)'s tests (the committed test schedule's key is public test
# material, derived from SHA-256("ghost/test/schedule-key")).
ed25519-dalek = { workspace = true }
