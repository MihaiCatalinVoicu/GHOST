// Negative fixture (Phase 8 design §5.2, §14.1): proto-check.sh checks every request message, not
// every file. GoodRequest carries the version, so a per-file check would pass; MissingRequest,
// WrongNumberRequest and NestedRequest must each be reported, and GoodRequest and Response not.
syntax = "proto3";

package ghost.bad.v1;

message GoodRequest {
  uint32 version = 1;
  bytes body = 2;
}

message MissingRequest {
  bytes body = 1;
}

message WrongNumberRequest {
  uint32 version = 2;
}

message NestedRequest {
  message Inner {
    uint32 other = 1;
  }
  Inner inner = 1;
}

message Response {
  bytes body = 1;
}
