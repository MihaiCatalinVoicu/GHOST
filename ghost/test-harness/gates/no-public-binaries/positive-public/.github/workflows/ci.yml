name: ci
on: [push]
jobs:
  android:
    runs-on: ubuntu-24.04
    steps:
      - name: gate
        run: echo gate
      - name: upload the gate report
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: gate-report
          path: ghost/build/report.txt
          retention-days: 3
