name: ci
on: [push]
jobs:
  native:
    runs-on: ubuntu-24.04
    steps:
      - name: build the native libraries
        run: echo build
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: ghost-client-net-jniLibs
          path: |
            ghost/android/network/src/main/jniLibs
            ghost/native-libs.sha256
          if-no-files-found: error
          retention-days: 1
  android:
    needs: native
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: ghost-client-net-jniLibs
          path: ghost
      - name: gate
        run: echo gate
      - name: upload the gate report
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: gate-report
          path: ghost/build/report.txt
          retention-days: 3
