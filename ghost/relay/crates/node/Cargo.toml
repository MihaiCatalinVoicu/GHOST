[package]
publish = false
name = "ghost-relay-node"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
description = "GHOST blind relay node: gRPC service over the store/capability/gossip/prune crates, token redemption, with privacy capture mode"

[[bin]]
name = "ghost-relay"
path = "src/main.rs"

[dependencies]
ghost-relay-api = { path = "../api" }
ghost-relay-storage = { path = "../storage" }
ghost-relay-capability = { path = "../capability" }
ghost-relay-gossip = { path = "../gossip" }
ghost-relay-prune = { path = "../prune" }
# Redemption (Phase 8 design §10, ADR-22): the Entitlement Schedule, tokens, nullifiers and the
# `ring` verification of the authenticator. Public-key work only; no issuer crate is linked.
ghost-entitlement = { path = "../../../issuer/crates/entitlement" }
tonic = { workspace = true, features = ["transport", "server", "channel", "router"] }
tokio = { workspace = true }
tokio-stream = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
hex = { workspace = true }
rand = { workspace = true }

[dev-dependencies]
ghost-capture-check = { path = "../../../test-harness/privacy/capture-check" }
tempfile = { workspace = true }
# Test Entitlement Schedules: the committed test ES re-signed with the test schedule key
# (SHA-256 of a public label; test schedules only).
ed25519-dalek = { workspace = true }
sha2 = { workspace = true }
# Independent recomputation of the capability MAC and serial in the conformance replayer.
hmac = { workspace = true }
# The SPKI of the vector file's non-schedule key (already in the normal graph through
# ghost-entitlement).
ghost-blind-rsa = { path = "../../../issuer/crates/blind-rsa" }
# Mutant MM18 (tests/redeem.rs) edits the persisted high-water directly.
redb = { workspace = true }
